/* ---- src/ai/protocol.js ---- */
/* AI protocol validator (browser). Mirrors server/forge_ai/protocol.py; both read src/ai/protocol.json.
   Model output is untrusted: unknown fields are dropped, types are checked/coerced, lists are capped. */
const AIProtocol = (() => {
const SPEC = {"version":1,"about":"ForgeEstimate AI protocol. Single source of truth for the assistant response envelope, estimate actions (mutations, require approval) and read-only tools (computed locally by the engine). Validated by src/ai/protocol.js in the browser and server/forge_ai/protocol.py on the backend. Field grammar: string | number | integer | boolean | enum:a|b | <typeName> | array<typeName> ; suffix ? = optional.","limits":{"reply":4000,"text":600,"actions":40,"tools":6,"observations":25,"missing":15,"components":20},"types":{"provenance":{"doc":"Where a number comes from. library/quote = authoritative ForgeEstimate data; estimate = derived from existing estimate data; assumption = not in ForgeEstimate. estimate and assumption values must be confirmed by the estimator before approval.","fields":{"kind":"enum:library|quote|estimate|assumption","ref":"string?","note":"string?"}},"component":{"doc":"Cost line on a new item. resource = library resource code (rate is then taken from the library, never from the model).","fields":{"type":"enum:Labor|Equipment|Material|Subcontract|Other","description":"string","qty":"number","unit":"string","resource":"string?","rate":"number?","rateSource":"provenance"}},"itemSet":{"fields":{"qty":"number?","prod":"number?","productionMethod":"enum:UM/DY|DY/UM|UM/PH|PH/UM|UM/MH|MH/UM?","shift":"number?","crew":"string?","name":"string?","section":"string?","unit":"string?"}},"rateMatch":{"doc":"Selects priced components across the estimate. All given criteria must match.","fields":{"type":"enum:Labor|Equipment|Material|Subcontract|Other|Crew|Quote?","resource":"string?","text":"string?","items":"array<string>?"}},"indirectSet":{"fields":{"qty":"number?","rate":"number?","amount":"number?","ratePct":"number?"}},"amountFrom":{"fields":{"item":"string","measure":"enum:bid|direct"}},"action":{"discriminator":"op","variants":{"add_item_from_assembly":{"doc":"New item built from a company assembly (crew, production and material links are snapshotted from the library).","fields":{"assembly":"string","qty":"number","section":"string?","name":"string?"}},"add_item":{"doc":"New manual item. Every priced component needs rateSource.","fields":{"name":"string","qty":"number","unit":"string","section":"string?","prod":"number?","productionMethod":"enum:UM/DY|DY/UM|UM/PH|PH/UM|UM/MH|MH/UM?","crew":"string?","components":"array<component>"}},"update_item":{"doc":"Change item fields. item = item code.","fields":{"item":"string","set":"itemSet"}},"delete_item":{"fields":{"item":"string"}},"adjust_rates":{"doc":"Scale unit rates of matching priced components by pct (e.g. 8 = +8%). Recorded as documented rate overrides.","fields":{"match":"rateMatch","pct":"number"}},"set_component_rate":{"fields":{"item":"string","component":"string","rate":"number","rateSource":"provenance"}},"add_indirect":{"fields":{"name":"string","basis":"enum:LS|DAY|UNIT|% Direct|% Bid","qty":"number?","rate":"number?","amount":"number?","ratePct":"number?","rateSource":"provenance"}},"update_indirect":{"doc":"indirect = indirect name.","fields":{"indirect":"string","set":"indirectSet","rateSource":"provenance?"}},"add_alternate":{"doc":"kind=deduct prices the removal of scope. Give amount (with rateSource) or amountFrom to compute it from an item.","fields":{"name":"string","kind":"enum:add|deduct","amount":"number?","amountFrom":"amountFrom?","rateSource":"provenance?"}},"set_markup":{"fields":{"overheadPct":"number?","contingencyPct":"number?","profitPct":"number?"}},"add_note":{"fields":{"item":"string","text":"string"}}}},"tool":{"discriminator":"tool","variants":{"explain_total":{"doc":"Bid build-up from direct cost to total bid with formulas.","fields":{}},"explain_item":{"doc":"Cost composition, production and unit-cost comparison for one item.","fields":{"item":"string"}},"find_items":{"fields":{"filter":"enum:no_production|no_quote|stale_quote|expiring_quote|zero_quantity|blocked|review|manual_cost|text","text":"string?"}},"quote_status":{"doc":"Every quote with age, expiry vs bid date and linked items.","fields":{}},"revision_diff":{"doc":"Changes between a saved revision (default: latest) and the current estimate.","fields":{"revision":"string?"}},"what_if":{"doc":"Prices hypothetical actions on a copy of the estimate. Nothing is changed.","fields":{"actions":"array<action>"}},"qa_scan":{"doc":"Deterministic validation rules and calculation tests.","fields":{}}}},"observation":{"fields":{"title":"string","detail":"string","severity":"enum:risk|warning|note","confidence":"enum:low|medium|high","refs":"array<string>?"}},"missingInfo":{"fields":{"what":"string","why":"string"}},"changeSet":{"fields":{"title":"string","rationale":"string?","actions":"array<action>"}},"envelope":{"doc":"Every assistant response.","fields":{"reply":"string","tools":"array<tool>?","changeSet":"changeSet?","observations":"array<observation>?","missing":"array<missingInfo>?"}}}};
const NUM_RE = /^\s*[-+]?\$?[\d,]*\.?\d+\s*%?\s*$/;

function parseField(def) {
  const optional = def.endsWith('?'), t = optional ? def.slice(0, -1) : def;
  if (t.startsWith('enum:')) return { kind: 'enum', values: t.slice(5).split('|'), optional };
  const m = t.match(/^array<(\w+)>$/); if (m) return { kind: 'array', of: m[1], optional };
  return { kind: t, optional };
}
function limitFor(name) { const L = SPEC.limits; return { action: L.actions, tool: L.tools, observation: L.observations, missingInfo: L.missing, component: L.components }[name] || 50; }

function check(kind, v, path, errs, extra) {
  if (kind === 'string') { if (typeof v === 'number') v = String(v); if (typeof v !== 'string') { errs.push(path + ': expected text'); return undefined; } v = v.trim(); const max = path.endsWith('reply') ? SPEC.limits.reply : SPEC.limits.text; return v.length > max ? v.slice(0, max) : v; }
  if (kind === 'number' || kind === 'integer') {
    if (typeof v === 'string' && NUM_RE.test(v)) v = Number(v.replace(/[$,%\s]/g, ''));
    if (typeof v !== 'number' || !Number.isFinite(v)) { errs.push(path + ': expected a number'); return undefined; }
    return kind === 'integer' ? Math.round(v) : v;
  }
  if (kind === 'boolean') { if (typeof v !== 'boolean') { errs.push(path + ': expected true/false'); return undefined; } return v; }
  if (kind === 'enum') { const hit = extra.values.find(x => x.toLowerCase() === String(v ?? '').trim().toLowerCase()); if (!hit) { errs.push(path + ': must be one of ' + extra.values.join(', ')); return undefined; } return hit; }
  if (kind === 'array') {
    if (!Array.isArray(v)) { errs.push(path + ': expected a list'); return undefined; }
    const max = limitFor(extra.of); if (v.length > max) errs.push(path + ': at most ' + max + ' entries');
    const prim = ['string', 'number', 'integer', 'boolean'].includes(extra.of);
    return v.slice(0, max).map((x, i) => prim ? check(extra.of, x, path + '[' + i + ']', errs, {}) : validate(extra.of, x, path + '[' + i + ']', errs)).filter(x => x !== undefined);
  }
  if (SPEC.types[kind]) return validate(kind, v, path, errs);
  errs.push(path + ': unknown type ' + kind); return undefined;
}

function validate(typeName, value, path = typeName, errs = []) {
  const T = SPEC.types[typeName]; if (!T) { errs.push(path + ': unknown type ' + typeName); return undefined; }
  if (!value || typeof value !== 'object' || Array.isArray(value)) { errs.push(path + ': expected an object'); return undefined; }
  let fields = T.fields, out = {};
  if (T.discriminator) {
    const d = T.discriminator, key = String(value[d] ?? '').trim(), variant = T.variants[key];
    if (!variant) { errs.push(path + '.' + d + ': unknown ' + d + ' "' + key + '"'); return undefined; }
    out[d] = key; fields = variant.fields;
    const args = value.args && typeof value.args === 'object' && !Array.isArray(value.args) ? { ...value.args, ...value } : value;
    value = args;
  }
  const before = errs.length;
  for (const [name, def] of Object.entries(fields)) {
    const f = parseField(def), v = value[name];
    if (v === undefined || v === null || v === '') { if (!f.optional) errs.push(path + '.' + name + ': required'); continue; }
    const r = check(f.kind, v, path + '.' + name, errs, f);
    if (r !== undefined) out[name] = r;
  }
  return errs.length > before ? undefined : out;
}

/* Envelope: invalid actions/tools/observations are dropped individually so one bad entry does not discard the answer. */
function parseEnvelope(raw) {
  let obj = raw, errors = [];
  if (typeof raw === 'string') { try { obj = JSON.parse(raw); } catch (e) { return { ok: false, errors: ['Response is not valid JSON'], value: null }; } }
  if (!obj || typeof obj !== 'object') return { ok: false, errors: ['Response is not an object'], value: null };
  const out = { reply: '', tools: [], changeSet: null, observations: [], missing: [] };
  const reply = check('string', obj.reply ?? '', 'reply', errors); out.reply = reply || '';
  const list = (key, type) => { const v = obj[key]; if (v == null) return []; if (!Array.isArray(v)) { errors.push(key + ': expected a list'); return []; } return v.slice(0, limitFor(type)).map((x, i) => validate(type, x, key + '[' + i + ']', errors)).filter(Boolean); };
  out.tools = list('tools', 'tool'); out.observations = list('observations', 'observation'); out.missing = list('missing', 'missingInfo');
  if (obj.changeSet) {
    const cs = obj.changeSet, actions = Array.isArray(cs.actions) ? cs.actions.slice(0, SPEC.limits.actions).map((a, i) => validate('action', a, 'changeSet.actions[' + i + ']', errors)).filter(Boolean) : [];
    if (!Array.isArray(cs.actions)) errors.push('changeSet.actions: expected a list');
    if (actions.length) out.changeSet = { title: check('string', cs.title || 'Proposed changes', 'changeSet.title', errors) || 'Proposed changes', rationale: cs.rationale ? check('string', cs.rationale, 'changeSet.rationale', errors) || '' : '', actions };
  }
  if (typeof obj.origin === 'string') out.origin = obj.origin.slice(0, 120);
  const ok = Boolean(out.reply || out.tools.length || out.changeSet || out.observations.length || out.missing.length);
  if (!ok) errors.push('Response contained nothing usable');
  return { ok, errors, value: out };
}

const opDoc = op => SPEC.types.action.variants[op]?.doc || '';
return { SPEC, validate: (t, v) => { const errors = []; const value = validate(t, v, t, errors); return { ok: !errors.length && value !== undefined, errors, value }; }, parseEnvelope, opDoc };
})();

/* ---- src/ai/actions.js ---- */
/* AI change sets: resolve proposed actions against the live estimate, price them on a copy with the
   real engine (preview), and apply approved sets through Ops inside one Store.commit (one undo step,
   normal audit, recalc and save). Nothing here keeps its own estimate state. */
const AIActions = (() => {
const E = Engine;
const lc = v => String(v ?? '').trim().toLowerCase();
const fmt$ = n => E.money(E.round(n));
const qtyTxt = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 3 });

function findItem(st, ref) { const r = lc(ref); if (!r) return -1; let i = st.items.findIndex(x => lc(x.code) === r); if (i < 0) i = st.items.findIndex(x => lc(x.name) === r); return i; }
function uniqueContains(list, ref, key) { const r = lc(ref); const exact = list.filter(x => lc(key(x)) === r); if (exact.length) return exact[0]; const hits = list.filter(x => lc(key(x)).includes(r) || r.includes(lc(key(x)))); return hits.length === 1 ? hits[0] : null; }
const findAssembly = (st, ref) => st.assemblies.find(a => lc(a.id) === lc(ref)) || uniqueContains(st.assemblies, ref, a => a.name);
const findCrew = (st, ref) => st.crews.find(c => lc(c.name) === lc(ref)) || null;
const findResource = (st, ref) => st.resources.find(r => lc(r.code) === lc(ref)) || null;
const findIndirect = (st, ref) => { const x = uniqueContains(st.indirects, ref, x => x.name); return x ? st.indirects.indexOf(x) : -1; };
const PCT_FIELDS = { overheadPct: 'Overhead', contingencyPct: 'Contingency', profitPct: 'Profit' };
const ITEM_LABEL = { qty: 'Quantity', prod: 'Production rate', productionMethod: 'Production method', shift: 'Shift hours', crew: 'Crew', name: 'Description', section: 'Section', unit: 'Unit' };

/* A provenance that is not authoritative ForgeEstimate data must be confirmed by the estimator. */
function needsConfirm(src) { return !src || src.kind === 'assumption' || src.kind === 'estimate'; }
function confirmFor(id, label, value, src) {
  const kind = src?.kind === 'estimate' ? 'estimate' : 'assumption';
  return { id, kind, label, value, note: src?.note || (src ? '' : 'No source given'), ref: src?.ref || '' };
}
function manualSnapshot(src, approvedBy) {
  return { kind: 'MANUAL', basis: src?.kind === 'estimate' ? 'AI_DERIVED' : 'AI_ASSUMPTION', note: src?.note || '', ref: src?.ref || '', approvedBy: approvedBy || '', capturedAt: new Date().toISOString() };
}

/* resolve(): checks one action against state st. Returns { ok, errors, warnings, confirms, steps, exec } where
   exec(st, audit, reason, approvedBy) performs the change through Ops on that same state. */
function resolve(st, a, key = 'a') {
  const R = { ok: true, errors: [], warnings: [], confirms: [], steps: [], exec: null, op: a.op };
  const err = m => { R.errors.push(m); R.ok = false; };
  const op = a.op;
  if (op === 'add_item_from_assembly') {
    const asm = findAssembly(st, a.assembly);
    if (!asm) err(`Assembly "${a.assembly}" is not in the company library (${st.assemblies.map(x => x.name).join(', ') || 'none'})`);
    if (!(a.qty > 0)) err('Quantity must be greater than zero');
    if (!R.ok) return R;
    const section = a.section || 'Added Scope', code = E.nextItemCode(st, st.items.at(-1)?.code || '0.00');
    R.steps.push({ kind: 'add', target: code + ' ' + (a.name || asm.name), field: 'New item', after: `${qtyTxt(a.qty)} ${asm.unit} · ${section}` });
    R.steps.push({ kind: 'src', target: '', field: 'Pricing source', after: `Assembly ${asm.name} v${asm.version || 1} · ${asm.crew || 'no crew'} · ${qtyTxt(asm.production)} ${asm.unit}/day · library rates` });
    R.exec = (s, audit, reason) => Ops.insertItem(s, Ops.assemblyItem(s, findAssembly(s, a.assembly), { qty: a.qty, section, name: a.name }), s.items.length, audit, 'item added', `${a.name || asm.name} · ${qtyTxt(a.qty)} ${asm.unit} (assembly ${asm.name})`, reason);
    return R;
  }
  if (op === 'add_item') {
    if (!a.name) err('Description is required');
    if (!(a.qty > 0)) err('Quantity must be greater than zero');
    if (!a.unit) err('Unit is required');
    if (a.crew && !findCrew(st, a.crew)) err(`Crew "${a.crew}" is not in the company library`);
    if (a.prod !== undefined && a.prod < 0) err('Production rate cannot be negative');
    const comps = [];
    (a.components || []).forEach((c, ci) => {
      const tag = `Component ${ci + 1} (${c.description})`;
      if (!(c.qty >= 0)) { err(tag + ': quantity must be zero or more'); return; }

  const src = c => { const s = c.sourceSnapshot || {}; if (s.kind === 'RESOURCE') return `Library ${s.code} v${s.version || 1}`; if (s.kind === 'CREW') return `Crew snapshot v${s.version || 1}`; if (s.kind === 'QUOTE') return `Quote ${s.id} ${s.vendor || ''}`; if (s.kind === 'MANUAL') return s.basis === 'AI_ASSUMPTION' ? 'Assumption (approved)' : s.basis === 'AI_DERIVED' ? 'Derived (approved)' : 'Manual input'; return s.kind || 'Unknown'; };
  const rows = [...it.costComponents].sort((a, b) => E.componentTotal(b) - E.componentTotal(a)).map(c => [c.type, c.description, q(c.qty) + ' ' + c.unit, $(c.rate), $(E.componentTotal(c)), pct(E.componentTotal(c), it.direct), src(c)]);
  const notes = [], ranked = [...st.items].sort((a, b) => b.direct - a.direct), rank = ranked.indexOf(it) + 1;
  notes.push(`${it.code} is ${pct(it.direct, T.direct)} of item direct cost (rank ${rank} of ${st.items.length}); unit cost ${$(unit)}/${it.unit}, bid ${$(it.bid)} (${$(it.qty ? it.bid / it.qty : 0)}/${it.unit}).`);
  if (it.prod > 0) notes.push(`Production ${q(it.prod)} ${it.productionMethod} → ${q(days)} days${it.crewSnapshot ? `, crew ${it.crewSnapshot.name} at ${$(it.crewSnapshot.hourlyRate)}/hr × ${it.shift} hr/day = ${$(it.crewSnapshot.hourlyRate * it.shift)}/day` : ''}.`);
  else notes.push('No production rate — duration-driven crew cost cannot be checked.');
  const asm = assemblyUnitCost(st, it.assemblySnapshot);
  if (asm) notes.push(`Assembly ${it.assemblySnapshot.name} standard: ${$(asm)}/${it.unit} at current library rates; this item carries ${$(unit)}/${it.unit} (${unit > asm ? '+' : ''}${pct(unit - asm, asm)}).`);
  const manual = it.costComponents.filter(c => (c.sourceSnapshot?.kind || 'MANUAL') === 'MANUAL').reduce((n, c) => n + E.componentTotal(c), 0);
  if (manual > 0) notes.push(`${$(manual)} (${pct(manual, it.direct)}) comes from manual inputs without a library or quote source.`);
  return { title: `${it.code} ${it.name} — cost composition`, summary: `Direct ${$(it.direct)} for ${q(it.qty)} ${it.unit}.`, cols: [C('Type'), C('Component'), C('Qty', 1), C('Rate', 1), C('Total', 1), C('Share', 1), C('Source')], rows, notes, refs: [it.code] };
}

const FILTER_LABEL = { no_production: 'Items without a production rate', no_quote: 'Items without a quote', stale_quote: 'Items with stale quotes', expiring_quote: 'Items with quotes expiring before bid', zero_quantity: 'Items with no quantity', blocked: 'Items with blockers', review: 'Items needing review', manual_cost: 'Items with large unsourced manual cost', text: 'Items matching' };
function findItems(st, filter, text = '') {
  const iss = E.issues(st), policy = Number(st.dataPolicies.quoteFreshDays || 30), bd = due(st), rows = [];
  st.items.forEach((it, i) => {
    let why = '';
    const qs = it.quoteSnapshot, live = qs ? st.quotes.find(x => x.id === qs.id) : null;
    if (filter === 'no_production' && !(Number(it.prod) > 0)) why = qs ? `Quoted (${qs.id}) — rule allows; schedule duration unknown` : 'Production 0 — flagged PROD_MISSING';
    if (filter === 'no_quote' && !it.costComponents.some(c => c.type === 'Quote')) why = it.crew ? 'Self-performed (' + it.crew + ')' : 'No quote and no crew';
    if (filter === 'stale_quote' && qs) { const age = qs.receivedDate ? Math.floor(E.ageDays(qs.receivedDate)) : null; if (age === null) why = `${qs.id} received date unknown`; else if (age > policy) why = `${qs.id} ${qs.vendor} received ${qs.receivedDate} (${age} d > ${policy} d policy)`; else if (live && (Math.abs(live.amount - qs.amount) > .005 || live.status !== qs.status)) why = `${qs.id} changed in quote log since snapshot`; }
    if (filter === 'expiring_quote' && qs?.expires && bd && new Date(qs.expires + 'T00:00:00') < bd) why = `${qs.id} expires ${qs.expires}, bid due ${st.project.due}`;
    if (filter === 'zero_quantity' && !(Number(it.qty) > 0)) why = 'Quantity 0';
    if (filter === 'blocked' || filter === 'review') { const k = filter === 'blocked' ? 'Block' : 'Review', m = iss.filter(x => x.i === i && x.kind === k); if (m.length) why = m.map(x => x.msg).join('; '); }
    if (filter === 'manual_cost') { const man = it.costComponents.filter(c => (c.sourceSnapshot?.kind || 'MANUAL') === 'MANUAL').reduce((n, c) => n + E.componentTotal(c), 0); if (it.direct > 0 && man / it.direct > .25) why = `${$(man)} of ${$(it.direct)} (${pct(man, it.direct)}) is manual input`; }
    if (filter === 'text') { const t = text.toLowerCase(); if ([it.code, it.name, it.section, it.notes].join(' ').toLowerCase().includes(t)) why = it.section; }
    if (why) rows.push([it.code, it.name, q(it.qty) + ' ' + it.unit, it.prod > 0 ? q(it.prod) + ' ' + it.productionMethod : '—', $(it.direct), why]);
  });
  const n = rows.length;
  return { title: FILTER_LABEL[filter] + (filter === 'text' ? ` "${text}"` : ''), summary: n ? `${n} of ${st.items.length} items.` : `None — all ${st.items.length} items pass this check.`, cols: [C('Item'), C('Description'), C('Qty', 1), C('Production'), C('Direct', 1), C('Finding')], rows, refs: rows.map(r => r[0]) };
}

function quoteStatus(st) {
  const bd = due(st), policy = Number(st.dataPolicies.quoteFreshDays || 30);
  const rows = st.quotes.map(x => {
    const age = x.receivedDate ? Math.floor(E.ageDays(x.receivedDate)) : null, linked = st.items.filter(it => it.quoteSnapshot?.id === x.id || it.quoteId === x.id).map(it => it.code), flags = [];
    if (age === null) flags.push('received date unknown'); else if (age > policy) flags.push(`stale (> ${policy} d)`);
    if (x.expires && bd && new Date(x.expires + 'T00:00:00') < bd) flags.push('expires before bid');
    if (x.status === 'Review') flags.push('unconfirmed');
    if (!linked.length && x.status === 'Selected') flags.push('selected but not used');
    const snapDiff = st.items.filter(it => it.quoteSnapshot?.id === x.id && Math.abs(it.quoteSnapshot.amount - x.amount) > .005).map(it => it.code);
    if (snapDiff.length) flags.push('snapshot differs on ' + snapDiff.join(', '));
    return [x.id, x.vendor, x.scope, $(x.amount), x.receivedDate || '—', age === null ? '—' : age + ' d', x.expires || '—', x.status, linked.join(', ') || '—', flags.join('; ') || 'OK'];
  });
  const bad = rows.filter(r => r[9] !== 'OK').length;
  return { title: 'Quote status', summary: `${st.quotes.length} quotes · ${bad} with findings · freshness policy ${policy} days · bid due ${st.project.due || 'not set'}.`, cols: [C('Quote'), C('Vendor'), C('Scope'), C('Amount', 1), C('Received'), C('Age', 1), C('Expires'), C('Status'), C('Items'), C('Findings')], rows };
}

function revisionDiff(st, ref) {
  if (!st.revisions.length) return { title: 'Changes since last revision', summary: 'No revision has been saved for this project, so there is nothing to compare against. Save a revision on the History sheet first.', cols: [], rows: [], missing: [{ what: 'Saved revision', why: 'Comparison needs a frozen revision snapshot' }] };
  const r = ref ? st.revisions.find(x => String(x.label).toLowerCase().includes(String(ref).toLowerCase())) || st.revisions.at(-1) : st.revisions.at(-1);
  const T = E.totals(st), rows = E.compareRevisionItems(r, st).map(x => [x.code, x.name, x.change, $(x.directA), $(x.directB), $(x.bidB - x.bidA)]);
  const notes = [];
  for (const f of ['overheadPct', 'contingencyPct', 'profitPct']) if (Number(r.settings?.[f]) !== Number(st.settings[f])) notes.push(`${f.replace('Pct', '')}: ${r.settings?.[f]}% → ${st.settings[f]}%`);
  const ind = new Map((r.indirects || []).map(x => [x.name, x])); for (const x of st.indirects) { const o = ind.get(x.name); const a = o ? E.indirectAmount(o, r.totals?.direct || 0, r.totals?.bid || 0) : 0, b = E.indirectAmount(x, T.direct, T.bid); if (!o) notes.push(`Indirect added: ${x.name}`); else if (Math.abs(a - b) > .5) notes.push(`Indirect ${x.name}: ${$(a)} → ${$(b)}`); ind.delete(x.name); }
  for (const n of ind.keys()) notes.push(`Indirect removed: ${n}`);
  return { title: `Changes since ${r.label}`, summary: `${r.label} saved ${String(r.at).slice(0, 10)} at ${$(r.totals?.bid)}; current bid ${$(T.bid)} (${T.bid - (r.totals?.bid || 0) >= 0 ? '+' : '−'}${$(Math.abs(T.bid - (r.totals?.bid || 0)))}). ${rows.length} item${rows.length === 1 ? '' : 's'} changed.`, cols: [C('Item'), C('Description'), C('Change'), C('Direct then', 1), C('Direct now', 1), C('Bid Δ', 1)], rows, notes };
}

function qaScan(st) {
  const iss = E.issues(st), tests = E.runCalculationTests(st);
  const rows = iss.filter(x => x.kind !== 'Info').map(x => [x.kind === 'Block' ? 'Blocker' : 'Review', x.code, x.i >= 0 ? st.items[x.i]?.code : 'Project', x.msg, x.fix]);
  const info = iss.filter(x => x.kind === 'Info').length, failed = tests.filter(t => !t.pass);
  return { title: 'Validation rules', summary: `${rows.filter(r => r[0] === 'Blocker').length} blockers · ${rows.filter(r => r[0] === 'Review').length} review · ${info} info · calculation tests ${tests.length - failed.length}/${tests.length}${failed.length ? ' (failed: ' + failed.map(t => t.name).join(', ') + ')' : ''}.`, cols: [C('Severity'), C('Rule'), C('Item'), C('Finding'), C('Fix')], rows, rules: true };
}

function run(st, t) {
  switch (t.tool) {
    case 'explain_total': return explainTotal(st);
    case 'explain_item': return explainItem(st, t.item);
    case 'find_items': return findItems(st, t.filter, t.text);
    case 'quote_status': return quoteStatus(st);
    case 'revision_diff': return revisionDiff(st, t.revision);
    case 'qa_scan': return qaScan(st);
    case 'what_if': { const pv = AIActions.preview(st, t.actions); return { title: 'What-if (not applied)', summary: `Bid ${$(pv.before.bid)} → ${$(pv.after.bid)} (${pv.delta.bid >= 0 ? '+' : '−'}${$(Math.abs(pv.delta.bid))}). Nothing has been changed.`, cols: [], rows: [], preview: pv, actions: t.actions }; }
  }
  return { title: 'Unknown tool', summary: t.tool, cols: [], rows: [] };
}
return { run, explainTotal, explainItem, findItems, quoteStatus, revisionDiff, qaScan };
})();

/* ---- src/ai/context.js ---- */
/* Builds the estimate context sent with each assistant request: a compact, read-only projection of the

const AIContext = (() => {
const E = Engine;
const r2 = n => E.round(n);
const SHEET_HINT = {
  worksheet: 'Bid items, quantities, production and cost components', pricing: 'Overhead, contingency, profit and bid build-up', indirects: 'Project indirect costs',
  alternates: 'Alternates priced outside the base bid', bidform: 'Item bid allocation', quotes: 'Vendor/subcontractor quote log and coverage', review: 'Validation blockers and review items',
  reports: 'Exports and backups', history: 'Revisions and audit log', resources: 'Company resource rate library', crews: 'Company crews', assemblies: 'Company assemblies'

function build(st, ui = {}) {

    days: r2(E.productionDays(it)), direct: r2(it.direct), bid: r2(it.bid), unitCost: it.qty ? r2(it.direct / it.qty) : null, status: it.status,
    assembly: it.assemblySnapshot ? it.assemblySnapshot.name + ' v' + (it.assemblySnapshot.version || 1) : null,
    quote: it.quoteSnapshot ? { id: it.quoteSnapshot.id, vendor: it.quoteSnapshot.vendor, amount: it.quoteSnapshot.amount, received: it.quoteSnapshot.receivedDate, expires: it.quoteSnapshot.expires, status: it.quoteSnapshot.status } : null,
    components: it.costComponents.map(c => ({ type: c.type, code: c.code, description: c.description, qty: r2(c.qty), unit: c.unit, rate: c.rate, total: E.componentTotal(c), source: c.sourceSnapshot?.kind === 'MANUAL' ? (c.sourceSnapshot.basis || 'MANUAL') : c.sourceSnapshot?.kind || 'UNKNOWN', override: c.override ? c.override.reason : undefined })),
    notes: it.notes || undefined, rules: iss.filter(x => x.i === i).map(x => x.code)
  }));
  return {
    today: E.today(),
    project: { ...st.project, quoteFreshDays: st.dataPolicies.quoteFreshDays, resourceFreshDays: st.dataPolicies.resourceFreshDays },
    settings: st.settings, totals: Object.fromEntries(Object.entries(T).map(([k, v]) => [k, r2(v)])),
    items,
    indirects: st.indirects.map(x => ({ name: x.name, basis: x.basis, qty: x.qty, rate: x.rate, ratePct: x.ratePct, amount: E.indirectAmount(x, T.direct, T.bid) })),
    alternates: st.alternates.map(a => ({ name: a.name, amount: a.amount, status: a.status })),
    quotes: st.quotes.map(q => ({ id: q.id, vendor: q.vendor, scope: q.scope, amount: q.amount, received: q.receivedDate, expires: q.expires, status: q.status, item: q.item || null, exclusions: q.exclusions || '' })),
    resources: st.resources.map(r => ({ code: r.code, name: r.name, type: r.type, unit: r.unit, rate: r.rate, effective: r.effectiveDate, version: r.version, locked: r.lockedStandard })),
    crews: st.crews.map(c => ({ name: c.name, productionUnit: c.productionUnit, hourlyRate: r2(E.crewRateFromLibrary(c.name, st)), members: c.members.map(([code, n]) => code + '×' + n).join(', ') })),
    assemblies: st.assemblies.map(a => ({ id: a.id, name: a.name, unit: a.unit, production: a.production, crew: a.crew, materials: (a.quantityLinks || []).map(l => l.resource + '×' + l.factor).join(', '), version: a.version })),
    rules: iss.map(x => ({ kind: x.kind, code: x.code, item: x.i >= 0 ? st.items[x.i]?.code : null, msg: x.msg })),
    revisions: st.revisions.map(r => ({ label: r.label, at: r.at, bid: r.totals?.bid })),
    recentAudit: st.audit.slice(0, 15).map(a => ({ at: a.at, area: a.area, field: a.field, from: String(a.oldValue).slice(0, 60), to: String(a.newValue).slice(0, 60), reason: a.reason })),
    ui: { sheet: ui.sheet || 'worksheet', sheetPurpose: SHEET_HINT[ui.sheet] || '', selectedItem: sel ? sel.code : null, selectedItemName: sel ? sel.name : null }

})();

  if (cs.discarded) return `<section class="as-sec as-cs"><header><span class="flag mute">Discarded</span><b>${esc(cs.title)}</b></header></section>`;
  const pv = AIActions.preview(Store.state, cs.actions, cs.enabled); cs.pv = pv;
  const needed = pv.confirms.filter(c => !cs.confirmed.has(c.id)), n = cs.enabled.filter((v, i) => v && pv.results[i].ok).length;
  const can = pv.valid && !needed.length;
  const rows = cs.actions.map((a, i) => {
    const r = pv.results[i], off = !cs.enabled[i];

    if (!r.ok) return `<tr class="bad"><td>${chk}</td><td class="mono">${i + 1}</td><td>${OP_LABEL[a.op] || a.op}</td><td colspan="5">${r.errors.map(esc).join('<br>')}</td></tr>`;
    return r.steps.map((s, si) => {

      const srcCell = c ? `<label class="as-conf ${cs.confirmed.has(c.id) ? 'ok' : ''}"><input type="checkbox" data-conf="${attr(c.id)}" ${cs.confirmed.has(c.id) ? 'checked' : ''}><span class="as-tag ${c.kind}">${c.kind === 'estimate' ? 'Derived' : 'Assumption'}</span>Confirm</label>` : s.src ? `<span class="as-tag lib">${esc(s.src)}</span>` : '';

      <thead><tr><th></th><th>#</th><th>Action</th><th>Target</th><th>Field</th><th class="n">Before</th><th class="n">After</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div>

}
function toolHtml(o, ti) {
  if (o.preview) return `<section class="as-sec"><header><span class="flag info">Engine · what-if</span><b>${esc(o.title)}</b><span class="sp"></span><button type="button" class="btn sm" data-propose="${ti}">Propose as change set</button></header><p class="as-why">${esc(o.summary)}</p>${impactHtml(o.preview, 'Bid')}</section>`;
  return `<section class="as-sec"><header><span class="flag ${o.rules ? 'block' : 'info'}">${o.rules ? 'Validation rules · deterministic' : 'Engine analysis'}</span><b>${esc(o.title)}</b></header><p class="as-why">${esc(o.summary)}</p>${tableHtml(o)}${o.notes?.length ? `<ul class="as-notes">${o.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</section>`;
}
function renderRes() {
  const root = el(), x = root && $('#asRes', root); if (!x) return;
  const t = turns.find(t => t.id === activeId);
  if (!t) { x.innerHTML = `<div class="as-blank"><div><b>Reads</b> project, items, quantities, production, crews, resources, assemblies, quotes, indirects, alternates, notes, totals, rule findings, revisions and recent audit.</div><div><b>Proposes</b> items, quantity/production/crew changes, rate adjustments, indirects, alternates, markup and notes — priced by the engine, applied only after your approval.</div><div><b>Never</b> invents prices, production, crew costs or quotes: values without a ForgeEstimate source are labeled and must be confirmed.</div></div>`; return; }
  const sc = x.scrollTop;
  const obsLabel = t.provider && t.provider.isModel === false ? 'Heuristic checks · rule-of-thumb, not validation' : 'AI observations · probabilistic — verify';
  x.innerHTML = `<div class="as-rq"><span class="k">Request</span>${esc(t.request)}<span class="sp"></span><span class="as-src">${esc(t.source)}</span></div>
    ${t.role === 'error' ? `<div class="callout block" style="margin:10px 12px">${esc(t.text)}${t.hint ? '<br>' + esc(t.hint) : ''}</div>` : t.text ? `<p class="as-reply">${esc(t.text)}</p>` : ''}
    ${t.cs ? changeSetHtml(t) : ''}
    ${t.tools.map((o, i) => toolHtml(o, i)).join('')}
    ${t.missing.length ? `<section class="as-sec"><header><span class="flag block">Not in ForgeEstimate</span><b>Missing information</b></header><ul class="as-miss">${t.missing.map(m => `<li><b>${esc(m.what)}</b> — ${esc(m.why)}</li>`).join('')}</ul></section>` : ''}
    ${t.obs.length ? `<section class="as-sec"><header><span class="flag ${t.provider?.isModel === false ? 'mute' : 'info'} as-obsflag">${obsLabel}</span><b>${t.obs.length} observation${t.obs.length === 1 ? '' : 's'}</b></header><div class="as-obs">${t.obs.map(o => `<div class="o ${o.severity}"><span class="sev">${o.severity}</span><div><b>${esc(o.title)}</b><span class="conf">${esc(o.confidence)} confidence</span><p>${esc(o.detail)}</p>${(o.refs || []).length ? o.refs.map(r => `<button type="button" class="as-ref" data-ref="${attr(r)}">${esc(r)}</button>`).join('') : ''}</div></div>`).join('')}</div></section>` : ''}
    ${t.dropped?.length ? `<div class="as-drop">Ignored ${t.dropped.length} malformed response part${t.dropped.length === 1 ? '' : 's'}: ${esc(t.dropped.slice(0, 3).join('; '))}</div>` : ''}`;

}
function render() { const r = el(); if (!r) return; if (!open) { r.hidden = true; return; } r.hidden = false; renderHead(); renderSug(); renderLog(); renderRes(); }

/* ---------------------------------------------------------------- turns */
function makeCs(c) {
  const enabled = c.actions.map(() => true), invalid = c.actions.map(() => '');
  const pv = AIActions.preview(Store.state, c.actions, enabled);
  pv.results.forEach((r, i) => { if (!r.ok) { enabled[i] = false; invalid[i] = r.errors.join('; '); } });
  return { title: c.title, rationale: c.rationale || '', actions: c.actions, enabled, invalid, confirmed: new Set(), applied: null, discarded: false };
}
function runTools(calls) { return calls.map(c => { try { return AITools.run(Store.state, c); } catch (e) { console.error(e); return { title: 'Analysis failed', summary: e.message, cols: [], rows: [] }; } }); }
function addTurn(t) { t.id = 'T' + (++seq); turns.push(t); activeId = t.id; if (turns.length > 60) turns.splice(0, turns.length - 60); return t; }
function ingest(request, env, provider, dropped, source) {
  return addTurn({ role: 'assistant', request, text: env.reply, source, provider, tools: runTools(env.tools), toolCalls: env.tools, cs: env.changeSet ? makeCs(env.changeSet) : null, obs: env.observations, missing: env.missing, dropped });
}
async function send(text) {
  text = String(text || '').trim(); if (!text || busy) return;
  const ui = uiCtx(), ctx = AIContext.build(Store.state, { sheet: ui.sheet });
  turns.push({ id: 'U' + (++seq), role: 'user', text, ctx: ui.item ? ui.item.split(' ')[0] : ui.label });
  const history = turns.filter(t => t.role === 'user' || t.role === 'assistant').slice(-9, -1).map(t => ({ role: t.role, text: t.role === 'user' ? t.text : t.text || '' }));
  const ep = endpoint();
  if (!ep) { addTurn({ role: 'error', request: text, text: 'The assistant service is not configured.', hint: 'Open Connection… to set the endpoint, or use the engine analyses below, which work offline.', source: 'Assist', tools: [], obs: [], missing: [] }); render(); return; }
  busy = true; renderLog();
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
    const r = await fetch(ep, { method: 'POST', headers: headers(), body: JSON.stringify({ message: text, context: ctx, history }), signal: ctl.signal }).finally(() => clearTimeout(timer));
    const b = await r.json().catch(() => null);
    if (!r.ok || !b?.ok) throw Error(b?.error || `Assistant service returned HTTP ${r.status}`);
    conn = { state: 'ok', provider: b.provider, error: '' };
    const parsed = AIProtocol.parseEnvelope(b.envelope);
    if (!parsed.value) throw Error('The assistant response failed validation: ' + parsed.errors.join('; '));
    ingest(text, parsed.value, b.provider, [...(b.dropped || []), ...parsed.errors], b.provider.isModel ? `AI · ${b.provider.label}` : 'Rules engine');
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'The assistant did not respond within 90 seconds.' : /fetch|network|load failed/i.test(e.message) ? 'Assistant service unreachable at ' + ep : e.message;
    if (/unreachable/.test(msg)) conn = { state: 'off', provider: null, error: 'Not connected' };
    addTurn({ role: 'error', request: text, text: msg, hint: 'Nothing in the estimate was changed.', source: 'Assist', tools: [], obs: [], missing: [] });
  } finally { busy = false; render(); }
}
const LOCAL = { explain_total: ['Bid build-up', { tool: 'explain_total' }], qa_scan: ['Validation rules', { tool: 'qa_scan' }], quote_status: ['Quote status', { tool: 'quote_status' }], no_production: ['Items without production', { tool: 'find_items', filter: 'no_production' }], revision_diff: ['Changes since last revision', { tool: 'revision_diff' }] };
function local(k) { const [label, call] = LOCAL[k]; addTurn({ role: 'assistant', request: label, text: '', source: 'Engine', provider: null, tools: runTools([call]), toolCalls: [call], cs: null, obs: [], missing: [] }); render(); }

function approve(t) {
  const cs = t.cs, pv = cs.pv;
  try {
    const res = AIActions.apply(cs.title, cs.actions, cs.enabled, cs.confirmed, pv.fingerprint);
    cs.applied = { at: new Date(), pv: res };
    UI.toast(`Applied: ${cs.title} · bid ${sgn(res.delta.bid)}`, { kind: 'ok' });
  } catch (e) { UI.toast(e.message, { kind: 'bad' }); }
  render();
}

/* ---------------------------------------------------------------- events */
function bind(root) {
  root.addEventListener('submit', e => { e.preventDefault(); const ta = $('#asText', root); const v = ta.value; ta.value = ''; send(v); });
  root.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'asText') { e.preventDefault(); $('#asForm', root).requestSubmit(); }
    if (e.key === 'Escape' && !UI.openDialogs.length) { e.preventDefault(); e.stopPropagation(); hide(); }
  });
  root.addEventListener('change', e => {
    const t = turns.find(t => t.id === activeId); if (!t?.cs) return;
    const inc = e.target.dataset.inc, cf = e.target.dataset.conf;
    if (inc !== undefined) { t.cs.enabled[Number(inc)] = e.target.checked; if (e.target.checked) t.cs.invalid[Number(inc)] = ''; renderRes(); }
    if (cf !== undefined) { e.target.checked ? t.cs.confirmed.add(cf) : t.cs.confirmed.delete(cf); renderRes(); }
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !root.contains(b)) return;
    const t = turns.find(t => t.id === activeId);
    if (b.dataset.sug) { const ta = $('#asText', root); ta.value = b.dataset.sug; ta.focus(); return; }
    if (b.dataset.turn) { activeId = b.dataset.turn; renderLog(); renderRes(); return; }
    if (b.dataset.local) { local(b.dataset.local); return; }
    if (b.dataset.ref) { const i = AIActions.findItem(Store.state, b.dataset.ref); if (i >= 0) { if (App.currentSheet() !== 'worksheet') App.go('worksheet'); App.selectItem(i); } return; }
    if (b.dataset.propose !== undefined && t) { const o = t.tools[Number(b.dataset.propose)]; t.cs = makeCs({ title: 'What-if: ' + (t.request || '').slice(0, 60), rationale: 'Converted from a what-if analysis.', actions: o.actions }); renderLog(); renderRes(); return; }
    const a = b.dataset.as;
    if (a === 'close') hide();
    else if (a === 'conn') connDialog();
    else if (a === 'approve' && t?.cs) approve(t);
    else if (a === 'discard' && t?.cs) { t.cs.discarded = true; render(); }
    else if (a === 'undo') { App.run('undo'); }
  });
  const grip = $('.as-grip', root);
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); const y0 = e.clientY, h0 = root.getBoundingClientRect().height; grip.setPointerCapture(e.pointerId);
    const mv = ev => { const h = Math.max(220, Math.min(window.innerHeight * .72, h0 + ev.clientY - y0)); root.style.height = h + 'px'; };
    const up = () => { grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up); UI.setPref('assistH', Math.round(root.getBoundingClientRect().height)); };
    grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up);
  });
}
function connDialog() {
  UI.dialog({ title: 'Assistant connection', width: 560, body: `<div class="form1">
      <p class="muted" style="margin:0 0 10px">ForgeEstimate sends the request and a read-only estimate context to your organization's assistant service. The AI provider key is held by that service — it is never stored in this file or browser.</p>
      <label class="fld"><span>Assistant endpoint</span><input id="acEp" value="${attr(endpoint())}" placeholder="https://estimating.example.com/api/assist"></label>
      <label class="fld"><span>Access token (optional, issued by your service)</span><input id="acTok" type="password" value="${attr(UI.pref('aiToken', ''))}" autocomplete="off"></label>
      <div id="acRes" class="muted" style="min-height:18px;margin-top:8px"></div></div>`,
    buttons: [{ label: 'Test connection', onClick: d => { UI.setPref('aiEndpoint', $('#acEp', d.el).value.trim()); UI.setPref('aiToken', $('#acTok', d.el).value.trim()); $('#acRes', d.el).textContent = 'Testing…'; health().then(c => { $('#acRes', d.el).textContent = c.state === 'ok' ? `Connected · ${c.provider.isModel ? c.provider.label + ' ' + c.provider.model : 'Rules engine (no AI model)'}` : c.error; }); return false; } },
      { label: 'Save', kind: 'primary', onClick: d => { UI.setPref('aiEndpoint', $('#acEp', d.el).value.trim()); UI.setPref('aiToken', $('#acTok', d.el).value.trim()); health(); } }]
  });
}

function show(text) {
  const root = el(); if (!root) return;
  if (!root.dataset.ready) { root.innerHTML = shellHtml(); bind(root); root.dataset.ready = '1'; const h = UI.pref('assistH', 0); if (h) root.style.height = h + 'px'; }
  if (!open) { open = true; if (conn.state !== 'ok') health(); }
  render(); App.render();
  const ta = $('#asText', root); if (text) send(text); else ta?.focus();
}
function hide() { open = false; render(); App.render(); }
function toggle() { open ? hide() : show(); }

App.cmd('assist', { label: 'Estimating assistant', key: 'Ctrl+J', run: () => toggle() });
App.cmd('aiReview', { label: 'Assistant review before submit', run: () => show('Find anything that looks wrong before I submit this bid') });
App.cmd('assistConnection', { label: 'Assistant connection…', run: () => connDialog() });
Store.subscribe?.(k => { if (open && k !== 'save') { renderHead(); renderSug(); if (turns.find(t => t.id === activeId)?.cs) renderRes(); } });

const api = { show, hide, toggle, send, isOpen: () => open, refresh: () => { if (open) { renderHead(); renderSug(); } }, turns: () => turns, health };
window.Assist = api;

})();

/* ---- src/ui/boot.js ---- */
/* Boot, public test API (window.ForgeEstimate) and the in-app self-test. */
(() => {
const E = Engine;
function selfTest() {
  const results = [], start = App.currentSheet(), s0 = Store.state, histLen = s0.history.length, redoLen = s0.redo.length;
  const check = (name, fn) => { try { fn(); results.push({ name, pass: true }); } catch (e) { results.push({ name, pass: false, error: String(e && e.stack || e) }); } };
  check('initial totals finite', () => { if (!Number.isFinite(E.totals(Store.state).bid)) throw Error('bid not finite'); });
  for (const sh of App.SHEETS) check('sheet ' + sh.id, () => { App.go(sh.id); const el = App.sheetEl(sh.id); if (!el.isConnected || el.innerHTML.length < 50 || el.querySelector('.empty h3')?.textContent === 'Missing sheet') throw Error('sheet did not render'); });
  check('calc tests', () => { const bad = E.runCalculationTests(Store.state).filter(t => !t.pass); if (bad.length) throw Error(JSON.stringify(bad)); });
  check('duplicate + undo', () => {
    App.go('worksheet'); const n = Store.state.items.length; if (!n) return;
    App.run('duplicate'); if (Store.state.items.length !== n + 1) throw Error('duplicate failed');
    Store.undo(); if (Store.state.items.length !== n) throw Error('undo failed');
    Store.state.redo.splice(redoLen); Store.state.history.splice(histLen); Store.save();
  });
  check('bid form reconciles', () => { const st = Store.state, sum = E.round(st.items.reduce((a, i) => a + Number(i.bid || 0), 0)), T = E.totals(st); if (st.project.bidAllocation !== 'MANUAL' && Math.abs(sum - T.bid) > .01) throw Error(sum + ' != ' + T.bid); });
  check('csv bridge', () => { const rows = E.csvRows(Store.state), last = rows.at(-1); if (last[0] !== 'Project bid' || Math.abs(last[1] - E.totals(Store.state).bid) > .001) throw Error('csv bridge mismatch'); });
  check('backup round-trip validates', () => { Store.validateBackup(JSON.parse(Store.backupText())); });
  App.go(start);
  document.getElementById('toasts').innerHTML = '';
  return { pass: results.every(r => r.pass), results };
}
App.cmd('runSelfTest', { label: 'Run full self-test', run: () => {
  const r = selfTest();
  UI.dialog({ title: 'Self-test ' + (r.pass ? 'passed' : 'FAILED'), width: 620, body: `<table class="g tests"><tbody>${r.results.map(x => `<tr><td>${UI.esc(x.name)}</td><td class="${x.pass ? 'pass' : 'fail'}">${x.pass ? 'Pass' : 'Fail'}</td><td class="muted" style="font-size:11px">${UI.esc((x.error || '').split('\n')[0])}</td></tr>`).join('')}</tbody></table>`, buttons: [{ label: 'Close', kind: 'primary' }] });
} });

try {
  App.bindChrome();
  App.render();
} catch (err) {
  console.error(err);
  document.getElementById('sheet').innerHTML = `<div class="empty"><h3>ForgeEstimate could not start</h3><p>${UI.esc(err.message)}</p><p>Your saved workspace has not been modified. Download it before trying again.</p><div class="row"><button type="button" class="btn primary" id="rawDl">Download saved workspace</button></div></div>`;
  document.getElementById('rawDl')?.addEventListener('click', () => Cells.download('forge-workspace-recovery.json', 'application/json', localStorage.getItem(E.STORAGE_KEY) || '{}'));
}
addEventListener('pagehide', () => { try { Store.flush(); } catch {} });
window.ForgeEstimate = Object.freeze({
  version: '2.0',
  totals: () => E.clone(E.totals(Store.state)), issues: () => E.clone(E.issues(Store.state)), tests: () => E.clone(E.runCalculationTests(Store.state)), state: () => E.clone(Store.state),
  selfTest, app: App, store: Store, engine: E, ui: UI
});
if (/[?&]selftest\b/.test(location.search)) { const r = selfTest(), pre = document.createElement('pre'); pre.id = 'selftest-result'; pre.hidden = true; pre.textContent = JSON.stringify(r, null, 2); document.body.appendChild(pre); }
})();
