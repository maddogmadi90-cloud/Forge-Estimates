.sp{flex:1}
.hidden{display:none!important}
.k{font:500 10.5px var(--fm);color:var(--text3);border:1px solid var(--rule3);border-bottom-width:2px;padding:0 4px;border-radius:2px;background:#fff}

/* ---------- application frame ---------- */
#app{height:100vh;display:grid;grid-template-rows:38px auto auto minmax(0,1fr) 30px 22px}
#app>.titlebar{grid-row:1}#app>.bridge{grid-row:2}#app>.assist{grid-row:3}#app>#sheet{grid-row:4}#app>.tabs{grid-row:5}#app>.status{grid-row:6}
.titlebar{background:var(--ink);color:var(--inktext);display:flex;align-items:stretch;min-width:0;border-bottom:1px solid #000}
.brand{display:flex;align-items:center;gap:8px;padding:0 14px 0 12px;color:#fff;border-right:1px solid var(--inkline);flex:none}
.brand svg{width:18px;height:18px}
.brand b{font:600 13px var(--fc);letter-spacing:.14em}
.brand span{font:500 13px var(--fc);letter-spacing:.14em;color:var(--inkmute)}
.menubar{display:flex;align-items:stretch;padding:0 4px}
.mb{border:0;background:transparent;color:var(--inktext);padding:0 10px;font-size:12.5px}
.mb:hover,.mb.open{background:var(--ink3);color:#fff}
.proj{display:flex;align-items:center;gap:10px;border:0;border-left:1px solid var(--inkline);border-right:1px solid var(--inkline);background:transparent;color:#fff;padding:0 14px;min-width:0;max-width:520px;text-align:left}
.proj:hover{background:var(--ink2)}
.proj .pn{font:500 11.5px var(--fm);color:var(--inkmute);white-space:nowrap}
.proj .pt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .pm{font-size:11.5px;color:var(--inkmute);white-space:nowrap}
.proj .pm b{color:#e9c46a;font-weight:500}
.proj .pm b.late{color:#f08a7e}
.cmdk{align-self:center;margin-left:auto;display:flex;align-items:center;gap:8px;height:26px;width:300px;border:1px solid var(--inkline);background:var(--ink2);color:var(--inkmute);padding:0 8px;border-radius:2px;font-size:12px}
.cmdk:hover{border-color:#56606a;color:var(--inktext)}
.cmdk .k{margin-left:auto;background:transparent;color:var(--inkmute);border-color:var(--inkline)}
.tb-right{display:flex;align-items:center;gap:2px;padding:0 6px 0 10px}
.tbi{height:30px;min-width:30px;border:0;background:transparent;color:var(--inktext);display:grid;place-items:center;border-radius:2px}
.tbi:hover:not(:disabled){background:var(--ink3);color:#fff}
.tbi:disabled{color:#4d555c}
.savest{font-size:11.5px;color:var(--inkmute);padding:0 10px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.savest i{width:7px;height:7px;border-radius:50%;background:#5aa877;display:inline-block}
.savest.saving i{background:#e9c46a}.savest.error i{background:#f08a7e}.savest.error{color:#f6b4ab}
.user{height:38px;border:0;border-left:1px solid var(--inkline);background:transparent;color:var(--inktext);padding:0 12px;font-size:12px;white-space:nowrap}
.user:hover{background:var(--ink2)}

/* bid bridge band */
.bridge{background:var(--paper);border-bottom:1px solid var(--rule3);display:flex;align-items:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
.bridge::-webkit-scrollbar{display:none}
.br-term{border:0;background:transparent;text-align:left;padding:6px 14px 6px;display:flex;flex-direction:column;justify-content:center;min-width:0;flex:none;border-right:1px solid var(--rule2)}
.br-term:hover{background:var(--panel)}
.br-term.on{box-shadow:inset 0 -2px 0 var(--accent)}
.br-l{font:600 10px var(--fc);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.br-l em{font-style:normal;color:var(--input);font-family:var(--f);font-weight:500;letter-spacing:0;margin-left:3px}
.br-v{font:500 15px var(--f);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px}
.br-op{display:flex;align-items:center;padding:0 2px;color:var(--text4);font:400 15px var(--f);flex:none;margin:0 -1px}
.br-term.bid{background:var(--bidBand);border-left:1px solid var(--rule)}
.br-term.bid .br-v{font-weight:600;font-size:17px;color:var(--bidInk)}
.br-term.bid:hover{background:var(--bidBandHead)}
.br-term.margin .br-v{color:var(--ok)}
.br-term.margin .br-v.neg{color:var(--block)}
.br-sp{flex:1;border-right:1px solid var(--rule2);min-width:12px}
.br-health{flex-direction:row;align-items:center;gap:14px}
.hcount{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.hcount b{font:600 15px var(--f);font-variant-numeric:tabular-nums}
.hcount.block b{color:var(--block)}.hcount.review b{color:var(--review)}.hcount.zero b{color:var(--text4)}
.mk{display:inline-block;width:8px;height:8px;flex:none}
.mk.block{background:var(--block)}
.mk.review{border:1.5px solid var(--review);transform:rotate(45deg);width:7px;height:7px}
.mk.info{border:1.5px solid var(--info);border-radius:50%}
.mk.ok{border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg) translate(1px,-1px);width:9px;height:5px}
.br-alts{font-size:11.5px;color:var(--text3);display:flex;align-items:center;padding:0 14px;white-space:nowrap;border-right:1px solid var(--rule2)}
.br-alts b{color:var(--text2);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}

/* sheet host */
#sheet{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column}
.tb{flex:none;height:38px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--rule);background:var(--panel)}
.tb-title{font:600 12px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text);padding-right:10px;margin-right:2px;border-right:1px solid var(--rule3);white-space:nowrap}
.tb-title small{font:400 12px var(--f);letter-spacing:0;text-transform:none;color:var(--text3);margin-left:8px}
.tb-sep{width:1px;align-self:stretch;margin:8px 3px;background:var(--rule3)}
.tb-note{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:26px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule3);background:#fff;padding:0 9px;border-radius:2px;font-size:12px;color:var(--text);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ruleDark);background:#fbfbfa}
.btn:active:not(:disabled){background:var(--panel2)}
.btn:disabled{color:var(--text4);background:var(--panel);border-color:var(--rule)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--ink3);border-color:var(--ink3)}
.btn.primary:disabled{background:#9aa1a6;border-color:#9aa1a6;color:#eef0f1}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover:not(:disabled){background:var(--accent2)}
.btn.danger{color:var(--block);border-color:#e1b7b2}
.btn.danger:hover:not(:disabled){background:var(--blockSoft);border-color:var(--block)}
.btn.dlg-danger,.dlg-f .btn.danger{background:var(--block);border-color:var(--block);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){border-color:var(--rule3);background:#fff}
.btn.sm{height:22px;padding:0 7px;font-size:11.5px}
.btn.icon{padding:0;width:26px;justify-content:center}
.btn.sm.icon{width:22px}
.seg{display:inline-flex;border:1px solid var(--rule3);border-radius:2px;background:#fff;height:26px}
.seg button{border:0;background:transparent;padding:0 9px;font-size:12px;color:var(--text2);border-right:1px solid var(--rule2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button .c{font-variant-numeric:tabular-nums;color:var(--text3);font-size:11px}
.seg button[aria-pressed="true"] .c{color:#c7cdd2}
.srch{display:flex;align-items:center;height:26px;border:1px solid var(--rule3);background:#fff;border-radius:2px;padding:0 7px;gap:6px;width:240px;color:var(--text3)}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.srch input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--text)}

/* ---------- bottom workbook tabs + status ---------- */
.tabs{display:flex;align-items:stretch;background:var(--panel2);border-top:1px solid var(--rule3);overflow-x:auto;scrollbar-width:thin;padding-left:6px}
.tab-g{display:flex;align-items:stretch;padding-right:6px;margin-right:6px;border-right:1px solid var(--rule3)}
.tab-g:last-child{border-right:0}
.tab-gl{font:600 9.5px var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--text4);display:flex;align-items:center;padding:0 8px 0 4px;white-space:nowrap}
.tab{border:1px solid transparent;border-top:0;background:transparent;margin-top:-1px;padding:0 12px;font-size:12px;color:var(--text2);white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative}
.tab:hover{color:var(--text);background:#e6e9e5}
.tab[aria-selected="true"]{background:var(--paper);border-color:var(--rule3);color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
.tab .cnt{font:500 10.5px var(--f);font-variant-numeric:tabular-nums;color:var(--text3)}
.tab .cnt.block{color:var(--block);font-weight:600}
.status{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--ink);color:var(--inkmute);font-size:11px;white-space:nowrap;overflow:hidden}
.status b{color:var(--inktext);font-weight:500;font-variant-numeric:tabular-nums}
.status .ok{color:#7cc49a}.status .bad{color:#f08a7e}
.status button{border:0;background:transparent;color:inherit;font-size:11px;padding:0}
.status button:hover{color:#fff;text-decoration:underline}

/* ---------- dense grid (shared) ---------- */
.gwrap{flex:1;min-height:0;overflow:auto;position:relative;background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%}
.g th{position:sticky;top:0;z-index:3;background:var(--panel);font:600 10.5px var(--fc);letter-spacing:.06em;text-transform:uppercase;color:var(--text2);text-align:left;padding:0 8px;height:26px;border-bottom:1px solid var(--rule3);border-right:1px solid var(--rule2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g th.n{text-align:right}
.g thead tr.gh th{height:20px;top:0;background:var(--panel2);font-size:9.5px;color:var(--text3);border-bottom:1px solid var(--rule);letter-spacing:.12em}
.g thead tr.gh + tr th{top:20px}
.g th.bidc{background:var(--bidBandHead)}
.g td{height:var(--rowH);padding:0 8px;border-bottom:1px solid var(--rule2);border-right:1px solid var(--rule2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper);vertical-align:middle}
.g td.bidc{background:var(--bidBand)}
.g td.code{font-family:var(--fm);font-size:11.5px;color:var(--text2)}
.g td.cell{padding:0}
.g tr:hover > td{background-image:linear-gradient(rgba(13,89,102,.035),rgba(13,89,102,.035))}
.g tfoot td{position:sticky;bottom:0;z-index:2;background:var(--panel);border-top:2px solid var(--text);border-bottom:0;font-weight:600;height:30px}
.g tfoot td.bidc{background:var(--bidBandHead)}
.g td.act{padding:0 3px;text-align:right}
.g td.sel,.g tr.sel > td{background:var(--accentSoft)}
.g tr.sel > td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.g td.dis{color:var(--text4);text-align:center}
/* cell inputs */
.ci,.cs{width:100%;height:calc(var(--rowH) - 1px);border:0;background:transparent;padding:0 8px;outline:0;font-variant-numeric:tabular-nums;color:var(--input);border-radius:0;min-width:0}
.ci.n{text-align:right}
.ci.t{color:var(--text)}
.ci:hover:not(:disabled),.cs:hover:not(:disabled){background:var(--inputBg);box-shadow:inset 0 0 0 1px var(--inputLine)}
.ci:focus,.cs:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
.ci:not([readonly]):focus{box-shadow:inset 0 0 0 2px var(--input);background:#fff}
.ci:disabled,.cs:disabled{color:var(--text2);-webkit-text-fill-color:var(--text2);cursor:default}
.ci.lockd{color:var(--text2)}
.cs{appearance:none;-webkit-appearance:none;padding-right:16px;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 9px) 50%,calc(100% - 5px) 50%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.cs:disabled{background-image:none}
input[type=date].ci{padding-right:2px}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0;vertical-align:middle}
.cellfocus{outline:0}
td[tabindex]:focus{box-shadow:inset 0 0 0 2px var(--accent);outline:0}

/* text flags (not pills) */
.flag{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--fc);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.flag.block{color:var(--block)}.flag.review{color:var(--review)}.flag.ok{color:var(--ok)}.flag.info{color:var(--info)}.flag.mute{color:var(--text3)}
.src{font:400 11.5px var(--f);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src b{font-weight:500;color:var(--text2)}
.src.warn{color:var(--review)}.src.bad{color:var(--block)}

/* ---------- worksheet ---------- */
.ws .g td,.ws .g th{border-right-color:transparent}
.ws .g td.vr,.ws .g th.vr{border-right-color:var(--rule)}
.ws .g td.gut{padding:0;text-align:center;position:sticky;left:0;z-index:1}
.ws .g td.c-code{position:sticky;left:26px;z-index:1}
.ws .g td.c-desc{position:sticky;left:94px;z-index:1;border-right:1px solid var(--rule)!important}
.ws .g thead th.gut{position:sticky;left:0;z-index:4}
.ws .g thead th.c-code{position:sticky;left:26px;z-index:4}
.ws .g thead th.c-desc{position:sticky;left:94px;z-index:4;border-right:1px solid var(--rule)}
.ws .g tfoot td.gut,.ws .g tfoot td.c-code,.ws .g tfoot td.c-desc{z-index:3}
.tw{width:20px;height:20px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--text3);padding:0;border-radius:2px}
.tw:hover{background:var(--rule2);color:var(--text)}
.tw .ic{width:12px;height:12px;transition:transform .12s}
.tw.open .ic{transform:rotate(90deg)}
.ws tr.sec td{height:28px;background:var(--panel2);border-bottom:1px solid var(--rule3);font-weight:600;color:var(--text)}
.ws tr.sec td.secname{font:600 11.5px var(--fc);letter-spacing:.07em;text-transform:uppercase}
.ws tr.sec td.secname small{font:400 11.5px var(--f);letter-spacing:0;text-transform:none;color:var(--text3);margin-left:10px}
.ws tr.sec td.bidc{background:#e5ebe0}
.ws tr.sec:not(:first-child) td{border-top:1px solid var(--rule3)}
.ws tr.it td{font-weight:500}
.ws tr.it td.c-desc .ci{font-weight:500}
.ws tr.it.open td{border-bottom-color:var(--rule)}
.ws tr.sub td{height:24px;background:#fcfcfb;font-size:12px;color:var(--text2);font-weight:400}
.ws tr.sub td.bidc{background:#f8faf6}
.ws tr.sub .ci{height:23px}
.ws tr.sub td.c-desc{padding-left:30px}
.ws tr.sub td.c-desc.cell{padding-left:22px}
.ws tr.mem td{height:22px;font-size:11.5px;color:var(--text3);background:#fafaf9}
.ws tr.mem td.c-desc{padding-left:52px}
.ws tr.sub.last td,.ws tr.strip.last td{border-bottom:1px solid var(--rule3)}
.ws tr.strip td{height:30px;background:#f7f8f6;font-size:12px;color:var(--text2)}
.ws tr.strip td.stripcell{padding:0 8px 0 30px;position:sticky;left:0}
.strip-in{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;white-space:nowrap}
.strip-in label{display:flex;align-items:center;gap:6px;font:600 10px var(--fc);letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.strip-in .fi{height:22px;font-size:12px}
.strip-in .stat{font-size:12px;color:var(--text2)}
.strip-in .stat b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.ctype{font:500 10.5px var(--fm);color:var(--text3);letter-spacing:.02em}
.ctype.Crew{color:#5a4a8a}.ctype.Material{color:#7a5a1e}.ctype.Quote{color:#2c5f7a}.ctype.Labor{color:#5a4a8a}.ctype.Equipment{color:#6b4a2a}.ctype.Other{color:var(--text3)}.ctype.Subcontract{color:#2c5f7a}
.xf{font-size:11.5px;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.xf.bad{color:var(--block)}
.stc{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:0}
.stc .b{color:var(--block);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.stc .r{color:var(--review);font-weight:600;display:inline-flex;align-items:center;gap:4px}
button.stc:hover{text-decoration:underline}
.ws tr.note td{height:auto;padding:5px 8px 6px 30px;background:#fffdf4;white-space:normal;color:var(--text2);font-size:12px;border-bottom:1px solid var(--rule)}
.ws tr.note textarea{width:100%;min-height:54px;border:1px solid var(--inputLine);background:#fff;padding:5px 7px;font-size:12px;resize:vertical;border-radius:2px}
.ws .g tfoot td{font-size:13px}
.ws .g tfoot td.lbl{font:600 11.5px var(--fc);letter-spacing:.08em;text-transform:uppercase}
.empty{padding:56px 24px;display:flex;flex-direction:column;align-items:flex-start;max-width:640px;margin:0 auto}
.empty h3{font:600 15px var(--f);margin:0 0 6px}
.empty p{color:var(--text2);margin:0 0 16px;line-height:1.5}
.empty .row{display:flex;gap:8px}
.ws-foot{flex:none;height:26px;display:flex;align-items:center;gap:16px;padding:0 10px;border-top:1px solid var(--rule);background:var(--panel);font-size:11.5px;color:var(--text3)}
.ws-foot b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- panes / generic layouts ---------- */
.split{flex:1;min-height:0;display:grid}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.pane + .pane{border-left:1px solid var(--rule3)}
.pane-h{flex:none;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--rule);background:var(--panel)}
.pane-h h3{margin:0;font:600 11px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text2);white-space:nowrap}
.pane-h .meta{font-size:11.5px;color:var(--text3);white-space:nowrap}
.pane-b{flex:1;min-height:0;overflow:auto}
.pad{padding:14px 16px}
.lbl{font:600 10px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.fgrid{display:grid;gap:10px 14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld > span{font:600 10px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text2)}
.fld.span2{grid-column:span 2}.fld.span4{grid-column:1/-1}
.fi{height:26px;border:1px solid var(--rule3);background:#fff;border-radius:2px;padding:0 7px;font-size:12.5px;min-width:0;width:100%}
.fi:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fi.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--input)}
.fi:disabled{background:var(--panel);color:var(--text3)}
textarea.fi{height:auto;padding:6px 7px;resize:vertical;line-height:1.45}
select.fi{padding-right:4px}
.fld .err{font-size:11px;color:var(--block)}
.fi.bad{border-color:var(--block);box-shadow:0 0 0 1px var(--block)}
.hint{font-size:11.5px;color:var(--text3);line-height:1.45}
.callout{border-left:3px solid var(--info);background:var(--infoSoft);padding:8px 10px;font-size:12px;line-height:1.45;color:var(--text2)}
.callout.block{border-color:var(--block);background:var(--blockSoft)}
.callout.review{border-color:var(--review);background:var(--reviewSoft)}
.callout.ok{border-color:var(--ok);background:var(--okSoft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}
.kv dt{color:var(--text3)}.kv dd{margin:0;font-variant-numeric:tabular-nums;color:var(--text)}

/* ---------- pricing statement ---------- */
.stmt{max-width:900px;margin:0;padding:18px 22px 28px}
.stmt h4{font:600 11px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin:0 0 8px}
.sl{display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,240px) 128px 140px;align-items:center;min-height:30px;border-bottom:1px solid var(--rule2);font-size:12.5px}
.sl > *{padding:0 8px}
.sl .d{color:var(--text3);font-size:11.5px}
.sl .a{text-align:right;font-variant-numeric:tabular-nums}
.sl.sub{border-top:1px solid var(--ruleDark);border-bottom:1px solid var(--rule3);font-weight:600;background:var(--panel)}
.sl.total{border-top:2px solid var(--text);border-bottom:3px double var(--text);font-weight:600;font-size:15px;min-height:38px;background:var(--bidBand)}
.sl.indent > :first-child{padding-left:22px}
.sl .pin{display:flex;align-items:center;border:1px solid var(--inputLine);background:var(--inputBg);height:24px;border-radius:2px}
.sl .pin input{border:0;background:transparent;width:100%;text-align:right;padding:0 4px 0 6px;color:var(--input);font-variant-numeric:tabular-nums;outline:0;height:22px}
.sl .pin:focus-within{border-color:var(--input);box-shadow:0 0 0 1px var(--input);background:#fff}
.sl .pin i{font-style:normal;color:var(--text3);padding-right:6px}
.sens{width:100%;border-collapse:collapse;font-size:12px}
.sens th{font:600 10px var(--fc);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);text-align:right;padding:5px 8px;border-bottom:1px solid var(--rule3)}
.sens th:first-child,.sens td:first-child{text-align:left}
.sens td{padding:5px 8px;border-bottom:1px solid var(--rule2);text-align:right;font-variant-numeric:tabular-nums}
.sens tr.cur td{background:var(--accentSoft);font-weight:600}

/* ---------- bid form document ---------- */
.desk{flex:1;min-height:0;overflow:auto;background:#d9dcd8;padding:22px 0 40px}
.paper{width:816px;max-width:calc(100% - 32px);margin:0 auto;background:#fff;border:1px solid #c3c7c3;box-shadow:0 1px 2px rgba(0,0,0,.08);padding:44px 52px 52px;color:#111}
.paper .ph{display:flex;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:16px}
.paper .ph h1{font:600 20px var(--f);margin:0 0 2px;letter-spacing:-.01em}
.paper .ph .sub{font-size:12px;color:#555}
.paper .ph .meta{margin-left:auto;text-align:right;font-size:12px;line-height:1.6}
.paper h5{font:600 10.5px var(--fc);letter-spacing:.12em;text-transform:uppercase;margin:20px 0 6px;color:#333}
.bft{width:100%;border-collapse:collapse;font-size:12px}
.bft th{font:600 10px var(--fc);letter-spacing:.08em;text-transform:uppercase;text-align:left;border-bottom:1px solid #111;padding:5px 6px;color:#333}
.bft th.n{text-align:right}
.bft td{padding:5px 6px;border-bottom:1px solid #ddd;font-variant-numeric:tabular-nums}
.bft td.code{font-family:var(--fm);font-size:11.5px}
.bft tfoot td{border-top:1.5px solid #111;border-bottom:3px double #111;font-weight:600;font-size:13px}
.bft input{width:120px;height:22px;text-align:right;border:1px solid var(--inputLine);background:var(--inputBg);color:var(--input);font-variant-numeric:tabular-nums;padding:0 5px;border-radius:2px}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:36px;font-size:11px;color:#555}
.sig div{border-top:1px solid #111;padding-top:4px}
.recon{display:flex;align-items:center;gap:8px;font-size:12px}
.recon b{font-variant-numeric:tabular-nums}

/* ---------- quotes coverage ---------- */
.qv tr.scope td{height:30px;background:var(--panel2);border-top:1px solid var(--rule3);border-bottom:1px solid var(--rule3);font-weight:600}
.qv tr.scope td .sn{font:600 12px var(--f)}
.qv tr.scope td .sm{font-weight:400;color:var(--text3);font-size:11.5px;margin-left:10px}
.qv tr.vq td.vendor{padding-left:30px}
.qv tr.vq.chosen td{background:#f4f8f6}
.qv tr.vq.chosen td.vendor{box-shadow:inset 3px 0 0 var(--ok)}
.radio{width:14px;height:14px;border:1.5px solid var(--ruleDark);border-radius:50%;display:inline-block;vertical-align:middle;background:#fff;padding:0}
.radio.on{border-color:var(--ok);background:radial-gradient(var(--ok) 0 3.5px,#fff 4px)}
button.radio:hover{border-color:var(--ok)}
.bar{height:6px;background:var(--rule2);position:relative;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--text3)}
.bar i.low{background:var(--ok)}
.exc{border-bottom:1px solid var(--rule2);padding:9px 12px;display:grid;grid-template-columns:14px 1fr;gap:4px 8px;font-size:12px;cursor:pointer}
.exc:hover{background:var(--panel)}
.exc .mk{margin-top:4px}
.exc b{font-weight:600}
.exc span{color:var(--text3);grid-column:2;font-size:11.5px}

/* ---------- review queue ---------- */
.rq{display:grid;grid-template-columns:14px 64px 1fr auto;gap:0 10px;align-items:center;padding:0 12px;height:34px;border-bottom:1px solid var(--rule2);cursor:pointer;font-size:12.5px;width:100%;border-left:0;border-right:0;border-top:0;background:#fff;text-align:left}
.rq:hover{background:var(--panel)}
.rq.on{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}
.rq .rc{font:500 11px var(--fm);color:var(--text2)}
.rq .rm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq .rk{font:400 10.5px var(--fm);color:var(--text4)}
.rgrp{height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--rule);font:600 10.5px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text2);position:sticky;top:0;z-index:1}
.rgrp b{font-variant-numeric:tabular-nums}
.res h2{font:600 16px var(--f);margin:0 0 4px}
.res .rec{font-size:12px;color:var(--text3);margin-bottom:14px}
.res .fixrow{display:flex;align-items:flex-end;gap:8px;margin:12px 0}
.res .fixrow .fld{width:180px}
.tests td.pass{color:var(--ok);font-weight:600}.tests td.fail{color:var(--block);font-weight:600}

/* ---------- reports ---------- */
.rl{width:100%;display:grid;grid-template-columns:18px 1fr;gap:2px 10px;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--rule2);background:#fff}
.rl:hover{background:var(--panel)}
.rl.on{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}
.rl b{font-weight:600;font-size:12.5px}
.rl span{grid-column:2;color:var(--text3);font-size:11.5px}
.rl .ic{margin-top:2px;color:var(--text2)}
.drop{border:1px dashed var(--ruleDark);background:var(--panel);padding:22px;text-align:center;color:var(--text2);font-size:12.5px}
.drop.over{border-color:var(--accent);background:var(--accentSoft)}

/* ---------- history ---------- */
.delta.up{color:var(--block)}.delta.down{color:var(--ok)}
.chg{font:600 10px var(--fc);letter-spacing:.08em;text-transform:uppercase}
.chg.Added{color:var(--ok)}.chg.Removed{color:var(--block)}.chg.Changed{color:var(--review)}
.oldnew{display:flex;align-items:center;gap:6px;min-width:0}
.oldnew s{color:var(--text3);text-decoration-color:var(--text4);overflow:hidden;text-overflow:ellipsis}
.oldnew .ic{width:11px;height:11px;color:var(--text4)}
.oldnew b{font-weight:500;overflow:hidden;text-overflow:ellipsis}

/* ---------- library master-detail ---------- */
.ml{width:100%;display:grid;grid-template-columns:1fr auto;gap:1px 10px;text-align:left;padding:8px 12px;border:0;border-bottom:1px solid var(--rule2);background:#fff;font-size:12.5px}
.ml:hover{background:var(--panel)}
.ml.on{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}
.ml b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .r{text-align:right;font-variant-numeric:tabular-nums}
.ml span{color:var(--text3);font-size:11.5px}
.dh{padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.dh .id{font:500 11px var(--fm);color:var(--text3)}
.dh h2{margin:2px 0 0;font:600 16px var(--f)}
.dh .fi.title{font:600 15px var(--f);height:30px;border-color:transparent;padding-left:4px;margin-left:-5px;width:min(520px,100%)}
.dh .fi.title:hover{border-color:var(--rule3)}
.dh .fi.title:focus{border-color:var(--accent)}
.figs{display:flex;gap:0;border-bottom:1px solid var(--rule)}
.figs > div{padding:8px 16px;border-right:1px solid var(--rule2)}
.figs b{display:block;font:500 15px var(--f);font-variant-numeric:tabular-nums;margin-top:1px}
.sect{padding:12px 16px 4px}
.sect h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:600 11px var(--fc);letter-spacing:.09em;text-transform:uppercase;color:var(--text2)}
.sect h4 .sp{flex:1}
.lockrow td{color:var(--text2)}
.lockbtn{border:0;background:transparent;padding:0;width:22px;height:22px;display:grid;place-items:center;color:var(--text4);border-radius:2px}
.lockbtn:hover{background:var(--rule2);color:var(--text)}
.lockbtn.on{color:var(--accent)}

/* ---------- dialogs, menus, palette, toasts ---------- */
.dlg-back{position:fixed;inset:0;background:rgba(18,22,25,.32);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:9vh}
.dlg{background:#fff;border:1px solid #9aa19b;box-shadow:0 18px 48px rgba(10,14,18,.28);max-height:84vh;display:flex;flex-direction:column;border-radius:3px}
.dlg-h{height:38px;display:flex;align-items:center;padding:0 6px 0 14px;border-bottom:1px solid var(--rule);background:var(--panel);flex:none}
.dlg-h h2{margin:0;font:600 12px var(--fc);letter-spacing:.09em;text-transform:uppercase}
.dlg-x{margin-left:auto;border:0;background:transparent;width:28px;height:28px;display:grid;place-items:center;color:var(--text2);border-radius:2px}
.dlg-x:hover{background:var(--rule2)}
.dlg-b{padding:14px 16px;overflow:auto;min-height:0}
.dlg-b.flush{padding:0}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--rule);background:var(--panel);flex:none}
.dlg-f .btn{height:28px;padding:0 14px}
.dlg-msg{margin:0;font-size:13px;line-height:1.5}
.dlg-detail{margin:8px 0 0;font-size:12px;color:var(--text3);line-height:1.5}
.menu{position:fixed;z-index:120;background:#fff;border:1px solid #9aa19b;box-shadow:0 8px 24px rgba(10,14,18,.2);padding:4px 0;min-width:230px;border-radius:2px}
.menu-i{width:100%;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;border:0;background:transparent;height:26px;padding:0 12px 0 6px;font-size:12.5px;text-align:left;color:var(--text)}
.menu-i:hover:not(:disabled),.menu-i:focus{background:var(--accent);color:#fff;outline:0}
.menu-i:hover .menu-k,.menu-i:focus .menu-k{color:#d5e6e9}
.menu-i:disabled{color:var(--text4)}
.menu-k{font:400 11px var(--f);color:var(--text3);padding-left:18px}
.menu-ck .ic{width:12px;height:12px}
.menu-sep{height:1px;background:var(--rule);margin:4px 0}
.menu-h{font:600 9.5px var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--text4);padding:6px 12px 2px 30px}
.pal{width:min(640px,calc(100vw - 24px))}
.pal input.pq{width:100%;height:44px;border:0;border-bottom:1px solid var(--rule);padding:0 14px;font-size:14px;outline:0}
.pal .pr{max-height:380px;overflow:auto}
.pal .po{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;width:100%;height:32px;border:0;background:#fff;padding:0 14px;text-align:left;font-size:12.5px}
.pal .po .t{font:600 9.5px var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.pal .po .x{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.pal .po.on{background:var(--accent);color:#fff}
.pal .po.on .t,.pal .po.on .x{color:#d5e6e9}
.pal .none{padding:16px 14px;color:var(--text3)}
#toasts{position:fixed;right:14px;bottom:62px;z-index:130;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--ink);color:#e8ecef;padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:14px;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .25s,transform .25s;max-width:440px}
.toast.out{opacity:0;transform:translateY(6px)}
.toast button{border:0;background:transparent;color:#8fd0da;font-weight:600;padding:0}
.toast.bad{background:#5c1712}
.kbd-t{width:100%;border-collapse:collapse;font-size:12.5px}
.kbd-t td{padding:5px 4px;border-bottom:1px solid var(--rule2)}
.kbd-t td:first-child{width:170px}
.kbd-t h6{margin:12px 0 4px;font:600 10px var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}

/* ---------- responsive ---------- */
@media (max-width:1280px){
  .cmdk{width:200px}
  .proj .pm{display:none}
}
@media (max-width:1024px){
  .menubar .mb:not(.mb-file){display:none}
  .cmdk{width:36px;padding:0;justify-content:center}.cmdk span,.cmdk .k{display:none}
  .br-term{padding:5px 10px}
  .br-term.opt{display:none}
  .br-op.opt{display:none}
  .tab-gl{display:none}
  .split.collapse-md{grid-template-columns:1fr!important}
  .split.collapse-md > .pane.secondary{display:none}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srch{width:170px}
}
@media (max-width:720px){
  .brand span,.savest span,.user{display:none}
  .proj{max-width:none;flex:1}
  .tb{overflow-x:auto}
  .tb-title small{display:none}
}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #app{display:block;height:auto}
  .titlebar,.bridge,.tabs,.status,.tb,#toasts,.noprint{display:none!important}
  #sheet,.sheet,.desk{display:block;overflow:visible;background:#fff;padding:0}
  .paper{border:0;box-shadow:none;width:auto;max-width:none;padding:0}
  .bft input{border:0;background:transparent;color:#111}
}
.dtag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 10px var(--fm);color:var(--text4);pointer-events:none;letter-spacing:.02em}
.ci.up{text-transform:uppercase}
.ws td.c-desc .ci{padding-right:52px}
.expbad .ci{color:var(--block);font-weight:600}
.g tr.cmp td.act .btn{opacity:.55}.g tr.cmp:hover td.act .btn{opacity:1}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;padding:12px 16px}
.fgrid .fld .fi{width:100%}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2)}
.err{color:var(--block);font-size:12px;min-height:16px;margin-top:8px}
.scope-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:16px}
.scope-grid textarea{width:100%;font:13px/1.55 var(--fm);resize:vertical}
.asm-pick{border:1px solid var(--rule);max-height:260px;overflow:auto}
.asm-pick .ap{display:grid;grid-template-columns:minmax(0,1fr) 44px 74px 140px 110px;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 10px;border:0;border-bottom:1px solid var(--rule2);background:var(--paper);font-size:12.5px;color:var(--text2);cursor:default}
.asm-pick .ap b{color:var(--text);font-weight:600}.asm-pick .ap .n{text-align:right;font-variant-numeric:tabular-nums}
.asm-pick .ap:hover{background:var(--panel)}.asm-pick .ap.on{background:var(--accentSoft);box-shadow:inset 3px 0 var(--accent)}
.kbd{display:inline-block;font:500 11px var(--fm);padding:1px 6px;border:1px solid var(--rule3);border-bottom-width:2px;border-radius:3px;background:var(--panel);color:var(--text)}

@media (max-width:1100px){.ws-keys{display:none}}
.btn.danger:disabled{color:var(--text4);background:var(--panel);border-color:var(--rule)}
.btn:disabled svg{opacity:.55}

/* ---------- Assist tray (docked under the bridge; pushes the sheet down) ---------- */
.asb{align-self:center;margin-left:auto;display:flex;align-items:center;gap:6px;height:26px;border:1px solid var(--inkline);background:transparent;color:var(--inktext);padding:0 10px;border-radius:2px;font:600 11px var(--fc);letter-spacing:.07em;text-transform:uppercase}
.asb:hover{background:var(--ink3);color:#fff}.asb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.asb+.cmdk{margin-left:8px}
.assist{position:relative;height:44vh;min-height:220px;display:grid;grid-template-rows:30px minmax(0,1fr);background:var(--paper);border-bottom:2px solid var(--accent);box-shadow:inset 0 1px 0 var(--rule3)}
.assist[hidden]{display:none}
.as-h{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px;background:var(--panel2);border-bottom:1px solid var(--rule3);min-width:0}
.as-t{display:flex;align-items:center;gap:6px;font:700 11px var(--fc);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding-right:10px;border-right:1px solid var(--rule3);height:100%}
.as-ctx{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.as-ctx .k,.as-rq .k{font:600 10px var(--fc);letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.as-ctx b{font-weight:600;margin-right:8px;overflow:hidden;text-overflow:ellipsis}
.as-conn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text3);white-space:nowrap}
.as-conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text4)}
.as-conn.ok::before{background:var(--ok)}.as-conn.rules::before{background:var(--info)}.as-conn.off::before{background:var(--review)}
.as-b{display:grid;grid-template-columns:minmax(300px,30%) minmax(0,1fr);min-height:0}
.as-l{display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;border-right:1px solid var(--rule3);background:var(--panel);min-height:0}
.as-log{overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.as-u,.as-a{display:block;text-align:left;font-size:12px;line-height:1.4;padding:6px 8px;border:1px solid var(--rule);background:#fff;border-radius:2px;width:100%}
.as-u{background:var(--inputBg);border-color:var(--inputLine);color:var(--input)}
.as-u,.as-a{flex-shrink:0}.as-a{color:var(--text2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}.as-tbl tr.as-realloc td{color:var(--text3);font-style:italic}.as-a:hover{border-color:var(--ruleDark)}
.as-a.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.as-a.err{border-color:#e1b7b2;color:var(--block)}.as-a.busy{color:var(--text3);font-style:italic}
.as-who{display:flex;align-items:center;gap:8px;font:600 10px var(--fc);letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:2px}
.as-empty{font-size:12px;color:var(--text2);line-height:1.5;padding:4px 2px}
.as-sug{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px 0}
.as-chip{border:1px solid var(--accentLine);background:var(--accentSoft);color:var(--accent2);font-size:11.5px;padding:2px 7px;border-radius:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-chip:hover{background:#d3e5e8}
.as-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:6px 10px}
.as-in textarea{resize:none;border:1px solid var(--rule3);background:#fff;padding:5px 7px;font-size:12.5px;line-height:1.35;border-radius:2px;min-height:44px}
.as-in textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.as-in .btn{height:44px}
.as-q{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:0 6px 6px 10px}
.as-q>span{font:600 10px var(--fc);letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-right:4px}
.as-r{overflow:auto;min-width:0;background:var(--paper)}
.as-blank{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px;font-size:12px;color:var(--text2);line-height:1.5}
.as-blank b{display:block;font:600 10.5px var(--fc);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.as-rq{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--rule);font-size:12px;color:var(--input)}
.as-src{font:600 10px var(--fc);letter-spacing:.07em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.as-reply{margin:10px 12px;font-size:12.5px;line-height:1.5;color:var(--text);max-width:980px;white-space:pre-wrap}
.as-sec{margin:0 12px 12px;border:1px solid var(--rule3);background:#fff}
.as-sec>header{display:flex;align-items:center;gap:10px;padding:0 8px;height:30px;background:var(--panel);border-bottom:1px solid var(--rule)}
.as-sec>header b{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-why{margin:8px 10px;font-size:12px;color:var(--text2)}
.as-tw{overflow-x:auto}
.as-tbl td{height:24px;padding:0 8px;border-bottom:1px solid var(--rule2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-tbl th{position:static}
.as-tbl tr.em td{font-weight:600;background:var(--bidBand)}
.as-cst td{vertical-align:middle}
.as-cst tr.add td{background:#f4f9f5}.as-cst tr.del td{background:var(--blockSoft);color:var(--block)}
.as-cst tr.bad td{background:var(--blockSoft);color:var(--block);white-space:normal;padding:4px 8px}
.as-cst tr.warn td{background:var(--reviewSoft);white-space:normal;padding:3px 8px;font-size:11.5px;color:var(--text2)}
.as-cst tr.off td{color:var(--text4);text-decoration:none}
.as-cst td.as-after{font-weight:600;color:var(--bidInk)}
.as-tag{display:inline-block;font:600 10px var(--fc);letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid var(--rule3);color:var(--text2);margin-right:5px;white-space:nowrap}
.as-tag.lib{border-color:#b9d3c2;background:var(--okSoft);color:var(--ok)}
.as-tag.assumption{border-color:#e6c48a;background:var(--reviewSoft);color:var(--review)}

.as-conf{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;cursor:pointer}
.as-conf.ok{color:var(--ok)}
.as-assume{margin:8px 10px;padding:6px 8px;border-left:3px solid var(--review);background:var(--reviewSoft);font-size:12px;color:var(--text2);line-height:1.5}
.as-assume>div{margin-top:3px}
.as-imp{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--bidBand)}
.as-imp>div{padding:6px 12px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:1px}

.as-imp b{font:600 13px var(--fm);color:var(--bidInk)}

.as-f{display:flex;align-items:center;gap:10px;padding:8px 10px}
.as-cs.done{border-color:#b9d3c2}
.as-notes,.as-miss{margin:6px 10px 10px;padding-left:18px;font-size:12px;line-height:1.5;color:var(--text2)}
.as-obs .o{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule2);font-size:12px}

.as-obsflag{border:1px dashed currentColor;padding:1px 5px}
.as-ref{border:1px solid var(--rule3);background:var(--panel);font:500 11px var(--fm);padding:0 5px;margin-right:4px;border-radius:2px;color:var(--accent2)}

.as-drop{margin:0 12px 12px;font-size:11px;color:var(--text3)}

<script>/* ---- src/engine.js ---- */

const Engine = (() => {

function resourceSnapshot(r) { return r ? { id: r.id, code: r.code, name: r.name, type: r.type, unit: r.unit, rate: Number(r.rate || 0), effectiveDate: r.effectiveDate || null, source: r.source || 'Unknown', sourceType: r.sourceType || 'LEGACY_UNKNOWN', version: r.version || null, capturedAt: new Date().toISOString() } : null; }

}
function buildAssemblyItem(s, a, { qty = 1, section = 'Added Scope', code, status = 'Review' } = {}) {
  const { cs, as, comps } = assemblyComponents(s, a, qty);
  return { id: uid(), code: code || nextItemCode(s, s.items.at(-1)?.code || '0.00'), section, name: a.name, qty, unit: a.unit, prod: a.production, shift: 10, crew: a.crew, productionMethod: 'UM/DY', assemblySnapshot: as, crewSnapshot: cs, costComponents: comps, status, overrideFlags: {}, notes: '' };

function seedState() {
  const s = baseDefaults();
  const makeFromAssembly = (code, section, assemblyId, qty, other = 0) => {
    const it = buildAssemblyItem(s, s.assemblies.find(x => x.id === assemblyId), { qty, section, code, status: 'Current' });
    if (other > 0) it.costComponents.push({ id: uid(), type: 'Other', code: 'OTHER', description: 'Other direct cost', qty: 1, unit: 'LS', rate: other, sourceSnapshot: { kind: 'MANUAL', capturedAt: new Date().toISOString() } });

  };

    makeFromAssembly('1.01', 'Water Distribution', 'A-001', 2600, 68390),
    makeFromAssembly('1.02', 'Water Distribution', 'A-002', 6, 19860),
    { id: uid(), code: '1.03', section: 'Water Distribution', name: 'Fire Hydrant Assemblies', qty: 3, unit: 'EA', prod: 1, shift: 10, crew: '', productionMethod: 'UM/DY', quoteId: 'Q-003', quoteSnapshot: q('Q-003'), costComponents: [{ id: uid(), type: 'Quote', code: 'Q-003', description: 'Mountain Supply · Fire Hydrants', qty: 1, unit: 'LS', rate: 24900, sourceSnapshot: { kind: 'QUOTE', ...q('Q-003') } }], status: 'Quoted', overrideFlags: {}, notes: '' },
    { id: uid(), code: '2.01', section: 'Earthwork + Restoration', name: 'Export Unsuitable Material', qty: 1420, unit: 'LCY', prod: 18, shift: 10, crew: 'Haul Crew 01', productionMethod: 'UM/DY', crewSnapshot: crewSnapshot('Haul Crew 01', s), costComponents: [{ id: uid(), type: 'Other', code: 'HAUL-RATE', description: 'Haul/disposal allowance', qty: 1, unit: 'LS', rate: 42600, sourceSnapshot: { kind: 'MANUAL', capturedAt: new Date().toISOString() } }], status: 'Current', rateMissing: false, overrideFlags: {}, notes: '' },
    { id: uid(), code: '2.02', section: 'Earthwork + Restoration', name: 'Asphalt Restoration', qty: 8400, unit: 'SF', prod: 0, shift: 10, crew: '', productionMethod: 'UM/DY', quoteId: 'Q-001', quoteSnapshot: q('Q-001'), costComponents: [{ id: uid(), type: 'Quote', code: 'Q-001', description: 'Front Range Paving · Asphalt Restoration', qty: 1, unit: 'LS', rate: 68400, sourceSnapshot: { kind: 'QUOTE', ...q('Q-001') } }], status: 'Quoted', overrideFlags: {}, notes: '' },
    { id: uid(), code: '3.01', section: 'Indirect + Closeout', name: 'Traffic Control', qty: 24, unit: 'DAY', prod: 1, shift: 10, crew: '', productionMethod: 'UM/DY', costComponents: [{ id: uid(), type: 'Other', code: 'TRAFFIC', description: 'Traffic control', qty: 1, unit: 'LS', rate: 31200, sourceSnapshot: { kind: 'MANUAL', capturedAt: new Date().toISOString() } }], status: 'Current', overrideFlags: {}, notes: '' }

function normalizeProject(s) {
  const b = baseDefaults();
  s = s && typeof s === 'object' ? s : {};

}

function itemCrewHeadcount(it) { return Number(it.crewSnapshot?.headcount || 1); }
function productionDays(it) {
  const q = Number(it.qty || 0), r = Number(it.prod || 0), shift = Math.max(.01, Number(it.shift || 10)), m = it.productionMethod || 'UM/DY';
  if (!(q > 0 && r > 0)) return 0;
  if (m === 'UM/DY') return q / r; if (m === 'DY/UM') return q * r; if (m === 'UM/PH') return (q / r) / shift; if (m === 'PH/UM') return (q * r) / shift;
  if (m === 'UM/MH') return (q / r) / (shift * Math.max(1, itemCrewHeadcount(it))); if (m === 'MH/UM') return (q * r) / (shift * Math.max(1, itemCrewHeadcount(it)));

}
function componentTotal(c) { return round(Number(c.qty || 0) * Number(c.rate || 0)); }
function syncCostComponents(it) {
  const days = productionDays(it), hrs = days * Number(it.shift || 10);
  for (const c of it.costComponents || []) {
    if (c.type === 'Crew') { c.qty = hrs; if (!(Number(c.rate) > 0)) c.rate = Number(it.crewSnapshot?.hourlyRate || 0); }
    if (c.quantityRule?.basis === 'PARENT_QTY') c.qty = Number(it.qty || 0) * Number(c.quantityRule.factor || 1);
    if (c.type === 'Quote') c.qty = 1;

}
/* Quantity of a component is engine-driven (not directly editable) for crew hours, PARENT_QTY links and quotes. */
function componentQtyLocked(c) { return c.type === 'Crew' || c.type === 'Quote' || Boolean(c.quantityRule); }
function calcItem(it) { syncCostComponents(it); it.direct = round((it.costComponents || []).reduce((n, c) => n + componentTotal(c), 0)); return it; }
function indirectAmount(x, direct, bid = 0) {
  if (x.basis === 'LS') return round(Number(x.amount || x.rate || 0));
  if (x.basis === 'DAY' || x.basis === 'UNIT') return round(Number(x.qty || 0) * Number(x.rate || 0));
  if (x.basis === '% Direct') return round(direct * Number(x.ratePct || 0) / 100);

}
function calculateEstimate(s, settingsOverride) {
  const st = settingsOverride ? { ...s.settings, ...settingsOverride } : s.settings;
  s.items.forEach(calcItem);
  const direct = round(s.items.reduce((n, i) => n + Number(i.direct || 0), 0));
  const fixed = round(s.indirects.filter(x => x.basis !== '% Bid').reduce((n, x) => n + indirectAmount(x, direct, 0), 0));
  const bidPct = s.indirects.filter(x => x.basis === '% Bid').reduce((n, x) => n + Number(x.ratePct || 0), 0) / 100;
  const base = round(direct + fixed), overhead = round(base * Number(st.overheadPct || 0) / 100), cont = round(base * Number(st.contingencyPct || 0) / 100), preProfit = round(base + overhead + cont), profitFactor = 1 + Number(st.profitPct || 0) / 100;

const totals = s => calculateEstimate(s);
function allocateItemBids(s) {
  const T = totals(s);
  if (s.project.bidAllocation === 'MANUAL') { s.items.forEach(i => i.bid = round(Number(i.bidOverride ?? i.bid ?? 0))); return T; }
  const weight = s.items.reduce((n, i) => n + Math.max(0, Number(i.direct || 0)), 0); let allocated = 0;

function recalc(s) { s.items.forEach(calcItem); return allocateItemBids(s); }

function palette() {

function bindChrome() {

function insertItemAt(item, at) {

function duplicate() {

function move(dir) {

async function renameSection(name) {

/* ---------- events ---------- */
function mount(el) {
  UI.bindGrid(el);
  el.addEventListener('mousedown', e => { const tr = e.target.closest('tr[data-i]'); if (tr) setSelected(el, Number(tr.dataset.i)); });
  el.addEventListener('focusin', e => { const tr = e.target.closest('tr[data-i]'); if (tr) setSelected(el, Number(tr.dataset.i)); });
  el.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-search]')) return;
    if (t.dataset.cf !== undefined) return editComponent(Number(t.dataset.i), Number(t.dataset.ci), t.dataset.cf, t.value);
    if (t.dataset.f) return editItem(Number(t.dataset.i), t.dataset.f, t.value);
  });
  el.addEventListener('input', e => { if (e.target.matches('[data-search]')) { filter = e.target.value; const pos = e.target.selectionStart; App.render(); const f = el.querySelector('[data-search]'); f.focus(); f.setSelectionRange(pos, pos); } });
  el.addEventListener('dblclick', e => { const d = e.target.closest('[data-act-dbl="rensec"]'); if (d) renameSection(d.dataset.sec); });
  el.addEventListener('click', e => {
    const f = e.target.closest('[data-filter]'); if (f) { statusFilter = f.dataset.filter; App.render(); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const i = Number(b.dataset.i), act = b.dataset.act, it = S().items[i];
    if (act === 'toggle') { if (expanded.has(it.id)) expanded.delete(it.id); else expanded.add(it.id); persistPrefs(); UI.setPendingFocus(it.id + ':desc'); App.render(); }
    else if (act === 'sec') { const n = b.dataset.sec; if (collapsed.has(n)) collapsed.delete(n); else collapsed.add(n); persistPrefs(); App.render(); }
    else if (act === 'mem') { const id = b.dataset.cid; if (memOpen.has(id)) memOpen.delete(id); else memOpen.add(id); App.render(); }
    else if (act === 'addcomp') addComponent(i);
    else if (act === 'rmcomp') removeComponent(i, Number(b.dataset.ci));
    else if (act === 'refresh') refreshSources(i);
    else if (act === 'refreshq') refreshQuote(i);
    else if (act === 'note') { noteOpen.add(it.id); App.render(); el.querySelector(`textarea[data-i="${i}"]`)?.focus(); }
    else if (act === 'history') itemHistory(i);
    else if (act === 'issues') { App.views.review?.filterItem?.(i); App.go('review'); }
    else if (act === 'cols') colsMenu(b);
  });
}
function colsMenu(anchor) {
  UI.menu(anchor, [{ heading: 'Optional columns' }, ...COLS.filter(c => c.opt).map(c => ({ label: (c.grp ? c.grp + ' · ' : '') + c.label, check: !hidden.has(c.id), run: () => { if (hidden.has(c.id)) hidden.delete(c.id); else hidden.add(c.id); persistPrefs(); App.render(); } })), '-', { label: 'Show all columns', run: () => { hidden.clear(); persistPrefs(); App.render(); } }], { align: 'right' });
}
function onKey(e) {
  const el = App.sheetEl('worksheet'), inSheet = el.contains(e.target) || e.target === document.body;
  if (!inSheet) return;
  const s = S(), mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Insert') { e.preventDefault(); addItem(); }
  else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicate(); }
  else if (mod && e.key.toLowerCase() === 'i') { e.preventDefault(); App.run('insertAssembly'); }
  else if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); move(e.key === 'ArrowUp' ? -1 : 1); }
  else if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const it = s.items[s.selected]; if (!it) return; e.preventDefault(); if (e.key === 'ArrowRight') expanded.add(it.id); else expanded.delete(it.id); persistPrefs(); UI.setPendingFocus(it.id + ':desc'); App.render(); }
  else if (e.key === 'Delete' && !e.target.matches('select,textarea')) {
    const row = e.target.closest('tr'); if (!row) return;
    e.preventDefault();
    if (row.classList.contains('cmp')) removeComponent(Number(row.dataset.i), Number(row.dataset.ci)); else if (row.classList.contains('it')) deleteItem();
  }
}

/* Commercial sheets: Pricing (markup statement), Indirects, Alternates, Bid Form (document). */
(() => {

const PCT_LABEL = { overheadPct: 'overhead %', contingencyPct: 'contingency %', profitPct: 'profit %' };

/* ===================== Pricing ===================== */
function setPct(f, raw) {
  const s = S(), v = Math.min(100, Math.max(0, E.round(E.num(raw)))), old = Number(s.settings[f]);

function pricingRender() {
  const s = S(), T = ctx.T, st = s.settings;

  const sens = cands.map(p => ({ p, R: E.calculateEstimate(s, { profitPct: p }) }));
  E.recalc(s);
  const comp = [['Item direct cost', T.direct], ['Fixed indirects', T.fixedIndirects], ['Overhead', T.overhead], ['Contingency', T.cont], ['Bid-based indirects', T.bidBasedIndirects], ['Profit', T.profit]];

  return `<div class="tb"><span class="tb-title">Pricing<small>Markup statement</small></span>

        ${L('Cost before profit', '', '', amt(pre), 'sub')}

          ${comp.map(([l, v]) => `<tr><td>${l}</td><td>${amt(v, 0)}</td><td>${T.bid ? UI.pct(v / T.bid * 100, 1) : '—'}</td><td><div class="bar"><i style="width:${Math.max(0, v / maxC * 100)}%"></i></div></td></tr>`).join('')}

      </div>

function fixer(x, s) {
  const it = s.items[x.i], comp = it && x.ref ? it.costComponents.find(c => c.id === x.ref) : null;
  const field = (label, id, val, type = 'text') => `<label class="fld"><span>${label}</span><input class="fi${type === 'num' ? ' n' : ''}" id="${id}" type="${type === 'num' ? 'text' : type}" value="${attr(val)}"></label>`;
  switch (x.code) {
    case 'BID_DUE_MISSING': return `<div class="fixrow">${field('Bid due date', 'fx', s.project.due || '', 'date')}<button type="button" class="btn primary" data-fix="due">Apply</button></div>`;
    case 'QTY_MISSING': return `<div class="fixrow">${field('Quantity (' + esc(it.unit || '') + ')', 'fx', it.qty || '', 'num')}<button type="button" class="btn primary" data-fix="qty">Apply</button></div>`;
    case 'UNIT_MISSING': return `<div class="fixrow">${field('Unit', 'fx', it.unit || '')}<button type="button" class="btn primary" data-fix="unit">Apply</button></div>`;
    case 'PROD_MISSING': return `<div class="fixrow">${field('Production rate (' + esc(it.productionMethod) + ')', 'fx', it.prod || '', 'num')}<button type="button" class="btn primary" data-fix="prod">Apply</button></div>`;
    case 'DUP_ITEM': case 'ITEM_CODE_MISSING': return `<div class="fixrow">${field('Item code', 'fx', E.nextItemCode(s, it.code || s.items.at(-1)?.code || '0.00'))}<button type="button" class="btn primary" data-fix="code">Apply</button></div>`;
    case 'RESOURCE_UNPRICED': case 'RESOURCE_RATE_NEGATIVE': return comp ? `<div class="fixrow">${field('Rate for ' + esc(comp.description) + ' / ' + esc(comp.unit), 'fx', comp.rate || '', 'num')}<button type="button" class="btn primary" data-fix="crate">Apply</button></div>` : '';
    case 'RESOURCE_QTY_NEGATIVE': return comp ? `<div class="fixrow">${field('Quantity for ' + esc(comp.description), 'fx', Math.max(0, comp.qty), 'num')}<button type="button" class="btn primary" data-fix="cqty">Apply</button></div>` : '';
    case 'ALT_UNPRICED': { const a = s.alternates.find(a => a.id === x.ref); return a ? `<div class="fixrow">${field('Amount for ' + esc(a.name), 'fx', '', 'num')}<button type="button" class="btn primary" data-fix="alt">Apply</button></div>` : ''; }
    case 'SOURCE_UNKNOWN': return `<div class="fixrow"><button type="button" class="btn primary" data-fix="confirmsrc">Confirm as estimator input</button></div><p class="hint">Records you as the confirming source; the cost stays unchanged.</p>`;
    case 'OVERRIDE_REASON': return `<div class="fixrow">${field('Override reason', 'fx', '')}<button type="button" class="btn primary" data-fix="reason">Apply</button></div>`;
    case 'COST_CROSSFOOT': return `<div class="fixrow"><button type="button" class="btn primary" data-fix="recalc">Recalculate item</button></div>`;
    case 'QUOTE_UNCONFIRMED': case 'QUOTE_EXPIRES': case 'QUOTE_STALE': case 'QUOTE_DATE_UNKNOWN': case 'QUOTE_ZERO': case 'QUOTE_SNAPSHOT_MISSING':
      return `<div class="fixrow"><button type="button" class="btn" data-fix="openquote">${icon('arrow')}Open in Quotes</button>${it?.quoteId && s.quotes.some(q => q.id === it.quoteId) ? `<button type="button" class="btn primary" data-fix="refreshquote">${icon('refresh')}Refresh snapshot from library</button>` : ''}</div>`;
    case 'LIBRARY_UPDATE_AVAILABLE': case 'RESOURCE_STALE': case 'CREW_SNAPSHOT_MISSING':
      return `<div class="fixrow"><button type="button" class="btn primary" data-fix="refreshsrc">${icon('refresh')}Refresh item sources</button></div><p class="hint">Re-snapshots crew, assembly and resource rates for this item from the company library.</p>`;
    case 'BID_ALLOCATION_MISMATCH': return `<div class="fixrow"><button type="button" class="btn" data-go="bidform">${icon('arrow')}Open Bid Form</button><button type="button" class="btn primary" data-fix="resetprop">Reset manual bids to proportional</button></div>`;
    case 'PCT_RANGE': return `<div class="fixrow"><button type="button" class="btn primary" data-go="pricing">${icon('arrow')}Open Pricing</button></div>`;
    case 'BID_PCT_RANGE': return `<div class="fixrow"><button type="button" class="btn primary" data-go="indirects">${icon('arrow')}Open Indirects</button></div>`;
  }
  return '';
}
function applyFix(x, kind, el) {
  const s = S(), i = x.i, it = s.items[i], v = el.querySelector('#fx')?.value;
  const edit = (f, val) => { if (!it) return; Store.commit(`Resolve ${x.code} on ${it.code}`, st => { const old = st.items[i][f]; st.items[i][f] = val; Store.audit('Estimate ' + it.code, f, old, val, 'Review fix'); }); };
  const comp = st => st.items[i].costComponents.find(c => c.id === x.ref);
  switch (kind) {
    case 'due': if (!v) return UI.toast('Enter a date'); Store.updateProjectIdentity({ due: v }); break;
    case 'qty': edit('qty', Math.max(0, E.num(v))); break;
    case 'unit': edit('unit', String(v).trim().toUpperCase()); break;
    case 'prod': edit('prod', Math.max(0, E.num(v))); break;
    case 'code': { const c = String(v).trim(); if (!c || s.items.some((y, j) => j !== i && String(y.code).trim().toLowerCase() === c.toLowerCase())) return UI.toast('Code is empty or already used', { kind: 'bad' }); edit('code', c); break; }
    case 'crate': Store.commit('Resolve unpriced resource', st => { const c = comp(st); const old = c.rate; c.rate = Math.max(0, E.num(v)); c.override = { reason: 'Priced in review', at: new Date().toISOString(), previous: old }; Store.audit('Estimate ' + it.code, 'component ' + c.code + ' rate', old, c.rate, 'Review fix'); }); break;
    case 'cqty': Store.commit('Resolve negative quantity', st => { const c = comp(st); const old = c.qty; c.qty = Math.max(0, E.num(v)); Store.audit('Estimate ' + it.code, 'component ' + c.code + ' qty', old, c.qty, 'Review fix'); }); break;
    case 'alt': Store.commit('Price alternate', st => { const a = st.alternates.find(a => a.id === x.ref); const old = a.amount; a.amount = Math.max(0, E.round(E.num(v))); if (a.amount > 0 && a.status === 'Unpriced') a.status = 'Priced'; Store.audit('Alternate ' + a.name, 'amount', old, a.amount, 'Review fix'); }); break;
    case 'confirmsrc': Store.commit('Confirm cost source', st => { const c = comp(st); c.sourceSnapshot = { kind: 'MANUAL', capturedAt: new Date().toISOString(), confirmedBy: st.user?.name || 'Local user', previousKind: 'LEGACY_UNKNOWN' }; Store.audit('Estimate ' + it.code, 'component source', 'LEGACY_UNKNOWN', 'MANUAL (confirmed)', 'Review fix'); }); break;
    case 'reason': if (!v) return UI.toast('Enter a reason'); Store.commit('Document override reason', st => { st.items[i].overrideFlags.rate.reason = v; Store.audit('Estimate ' + it.code, 'override reason', '', v, 'Review fix'); }); break;
    case 'recalc': Store.commit('Recalculate item', () => {}); break;
    case 'openquote': App.views.quotes.focusQuote(it?.quoteId || x.ref); App.go('quotes'); return;
    case 'refreshquote': Store.commit('Refresh quote snapshot ' + it.code, st => { E.refreshQuoteSnapshot(st, st.items[i]); Store.audit('Estimate ' + it.code, 'quote snapshot', 'snapshot', it.quoteId, 'Review fix'); }); break;
    case 'refreshsrc': Store.commit('Refresh estimate sources ' + it.code, st => { E.refreshItemSources(st, st.items[i]); Store.audit('Estimate ' + it.code, 'source refresh', 'snapshot', 'current library', 'Review fix'); }); break;
    case 'resetprop': App.run('allocProportional'); App.run('allocManual'); break;
  }
  UI.toast('Applied — estimate re-checked');
}
function render() {
  const s = S(), all = ctx.issues;
  let list = all.filter(x => (kindFilter === 'all' || KIND[x.kind] === kindFilter) && (itemFilter === null || x.i === itemFilter));
  if (!list.some(x => keyOf(x) === selKey)) selKey = list[0] ? keyOf(list[0]) : null;
  const sel = list.find(x => keyOf(x) === selKey);
  const groups = [['Block', 'Blockers — must be resolved before export'], ['Review', 'Review — estimator judgment required'], ['Info', 'Information']];
  const count = k => all.filter(x => (itemFilter === null || x.i === itemFilter) && (k === 'all' || KIND[x.kind] === k)).length;
  const seg = (k, l) => `<button type="button" data-kf="${k}" aria-pressed="${kindFilter === k}">${l}<span class="c">${count(k)}</span></button>`;
  const fi = itemFilter !== null ? s.items[itemFilter] : null;
  const tests = ctx.tests, pass = tests.filter(t => t.pass).length;
  const it = sel && sel.i >= 0 ? s.items[sel.i] : null;
  return `<div class="tb"><span class="tb-title">Review<small>${ctx.blocks} blockers · ${ctx.reviews} review · ${ctx.infos} info</small></span>
      <div class="seg" role="group" aria-label="Severity">${seg('all', 'All')}${seg('block', 'Blockers')}${seg('review', 'Review')}${seg('info', 'Info')}</div>
      ${fi ? `<button type="button" class="btn" data-clearitem>${icon('x')}Item ${esc(fi.code)}</button>` : ''}
      <span class="sp"></span>
      <button type="button" class="btn" data-cmd="aiReview" title="Rules stay here; the assistant adds observations in the Assist tray">${icon('spark')}Assistant review</button>
      <span class="tb-note">${ctx.blocks ? 'CSV export is blocked until blockers are resolved.' : 'No blockers — the estimate can be exported.'}</span></div>
    <div class="split collapse-md" style="grid-template-columns:minmax(380px,1fr) minmax(380px,1fr)">
      <div class="pane"><div class="pane-b" data-scroll="rq">
        ${list.length ? groups.map(([k, l]) => { const g = list.filter(x => x.kind === k); if (!g.length) return ''; return `<div class="rgrp"><i class="mk ${KIND[k]}"></i>${l}<span class="sp"></span><b>${g.length}</b></div>` + g.map(x => { const t = x.i >= 0 ? s.items[x.i] : null; return `<button type="button" class="rq${keyOf(x) === selKey ? ' on' : ''}" data-rk="${attr(keyOf(x))}" data-fk="rq:${attr(keyOf(x))}"><i class="mk ${KIND[x.kind]}"></i><span class="rc">${esc(t ? t.code : 'Project')}</span><span class="rm">${esc(x.msg)}${t ? ` <span class="muted">· ${esc(t.name)}</span>` : ''}</span><span class="rk">${esc(x.code)}</span></button>`; }).join(''); }).join('')
          : `<div class="empty"><h3><span class="flag ok" style="font-size:13px"><i class="mk ok"></i>Clear</span></h3><p>No ${kindFilter === 'all' ? '' : kindFilter + ' '}exceptions${fi ? ' for item ' + esc(fi.code) : ''}. All validation rules pass.</p></div>`}
      </div></div>
      <div class="pane secondary"><div class="pane-b">
        ${sel ? `<div class="pad res">
          <div class="flag ${KIND[sel.kind]}" style="margin-bottom:6px"><i class="mk ${KIND[sel.kind]}"></i>${sel.kind === 'Block' ? 'Blocker' : sel.kind} · ${esc(sel.code)}</div>
          <h2>${esc(sel.msg)}</h2>
          <div class="rec">${esc(sel.fix)}</div>
          ${it ? `<dl class="kv" style="margin-bottom:10px"><dt>Item</dt><dd><b>${esc(it.code)}</b> ${esc(it.name)}</dd><dt>Section</dt><dd>${esc(it.section)}</dd><dt>Quantity</dt><dd>${UI.qty(it.qty)} ${esc(it.unit)}</dd><dt>Direct cost</dt><dd>${UI.usd(it.direct, 2)}</dd>${it.quoteSnapshot ? `<dt>Quote snapshot</dt><dd>${esc(it.quoteSnapshot.id)} ${esc(it.quoteSnapshot.vendor)} · ${UI.usd(it.quoteSnapshot.amount, 2)} · exp ${UI.date(it.quoteSnapshot.expires)}</dd>` : ''}</dl>` : ''}

        </div>` : ''}
        <div class="pane-h" style="border-top:1px solid var(--rule)"><h3>Calculation integrity</h3><span class="meta">${pass}/${tests.length} pass</span><span class="sp"></span><button type="button" class="btn sm" data-cmd="runSelfTest">Run full self-test</button></div>
        <table class="g tests"><colgroup><col><col style="width:60px"><col style="width:150px"><col style="width:150px"></colgroup><thead><tr><th>Test</th><th>Result</th><th class="n">Expected</th><th class="n">Actual</th></tr></thead>
        <tbody>${tests.map(t => `<tr><td>${esc(t.name)}</td><td class="${t.pass ? 'pass' : 'fail'}">${t.pass ? 'Pass' : 'Fail'}</td><td class="n" title="${attr(t.expected)}">${typeof t.expected === 'number' ? amt(t.expected) : esc(t.expected)}</td><td class="n" title="${attr(t.actual)}">${typeof t.actual === 'number' ? amt(t.actual) : esc(t.actual)}</td></tr>`).join('')}</tbody></table>
      </div></div>
    </div>`;
}
App.register('review', {
  render,
  filterItem(i) { itemFilter = i; kindFilter = 'all'; selKey = null; },
  onShow(opts) { if (opts.clearFilter) itemFilter = null; },
  onKey(e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const el = App.sheetEl('review'), btns = [...el.querySelectorAll('.rq')], i = btns.findIndex(b => b.dataset.rk === selKey);
    const n = btns[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (!n) return; e.preventDefault(); selKey = n.dataset.rk; UI.setPendingFocus('rq:' + selKey); App.render();

  }

})();

function editResource(k, f, raw) {
